<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexa Relation | 冒険者データ 登録フォーム</title>
    <meta name="description" content="Hexa Relationへポートフォリオ制作をご依頼いただく方向けのヒアリングフォームです。">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --accent: #ff3b3b;
            --gold: #ffcc4d;
            --bg-color: #000;
            --window-bg: #0a0a0a;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'DotGothic16', sans-serif;
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
            min-height: 100vh;
        }

        .px { font-family: 'Press Start 2P', 'DotGothic16', sans-serif; }

        .back-link-fixed {
            position: fixed; top: 4%; left: 4%; z-index: 20;
            color: rgba(255,255,255,0.65); font-size: 0.55rem;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 10px; text-decoration: none;
        }
        .back-link-fixed:hover { color: var(--gold); border-color: var(--gold); }

        .mother-window {
            background-color: var(--window-bg);
            border-top: 4px solid var(--accent);
            box-shadow: inset 0 0 0 2px #fff, 0 10px 30px rgba(0,0,0,0.6);
            padding: 4px;
            width: 100%;
            max-width: 560px;
            margin: 30px 0 60px;
        }

        .mother-window-inner { padding: 2.2rem 1.8rem; }

        h1 {
            font-size: 1rem; margin: 0 0 1rem; letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border-color); padding-bottom: 0.8rem;
            text-align: center; color: var(--gold);
        }

        #guidance-text {
            font-size: 0.72rem; line-height: 2; letter-spacing: 0.02em;
            margin-bottom: 1.8rem; color: #aaa; text-align: center;
        }
        #guidance-text .highlight { color: var(--gold); }

        .section-title {
            font-size: 0.8rem; color: var(--gold); margin: 2.2rem 0 1.2rem;
            padding-bottom: 0.5rem; border-bottom: 1px dashed var(--border-color);
        }
        .section-title:first-of-type { margin-top: 0; }

        .input-group { margin-bottom: 1.4rem; }
        label { display: block; margin-bottom: 0.6rem; font-size: 0.75rem; color: var(--gold); }
        label .optional { color: #777; font-size: 0.65rem; margin-left: 4px; }
        label .hint { display: block; color: #777; font-size: 0.65rem; margin-top: 4px; }

        input, textarea {
            width: 100%;
            background: #000;
            border: 2px solid var(--border-color);
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s;
        }
        input::placeholder, textarea::placeholder { color: #555; }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,59,59,0.15); }

        .submit-btn {
            width: 100%;
            font-family: 'Press Start 2P', monospace;
            background: var(--gold);
            border: 3px solid #fff;
            box-shadow: 4px 4px 0 #b8281f;
            color: #000;
            padding: 14px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 1rem;
            letter-spacing: 0.05em;
        }
        .submit-btn:active { box-shadow: 1px 1px 0 #b8281f; transform: translate(3px, 3px); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .back-link { display: block; text-align: center; margin-top: 1.6rem; color: #666; text-decoration: none; font-size: 0.75rem; }
        .back-link:hover { color: var(--gold); }

        #success-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; text-align: center;
            padding: 20px;
        }
        #success-overlay .mother-window-inner p { color: #fff; font-size: 0.85rem; line-height: 2.2; }

        /* 画像添付 */
        .file-btn {
            display: inline-block; cursor: pointer;
            background: #0a0a0a; color: var(--gold);
            border: 2px solid var(--border-color); padding: 12px 20px;
            font-size: 0.7rem; letter-spacing: 0.05em;
        }
        .file-btn:hover { border-color: var(--gold); }
        #image-previews { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .thumb { position: relative; width: 84px; }
        .thumb img {
            width: 84px; height: 84px; object-fit: cover;
            border: 2px solid var(--border-color); display: block; background: #111;
        }
        .thumb .remove {
            position: absolute; top: -8px; right: -8px;
            width: 22px; height: 22px; line-height: 20px; text-align: center;
            background: var(--accent); color: #fff; border: 2px solid #fff;
            cursor: pointer; font-size: 0.7rem; padding: 0;
        }
        .thumb .cap {
            font-size: 0.55rem; color: #777; margin-top: 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        #image-status.over { color: var(--accent); }
    </style>
</head>
<body>
    <a href="../" class="back-link-fixed">◀ もどる</a>

    <div class="mother-window">
        <div class="mother-window-inner">
            <h1 class="px">▼ 冒険者データ 登録フォーム</h1>
            <p id="guidance-text">
                ポートフォリオサイト制作のためのヒアリングシートです。<br>
                <span class="highlight">情報が少なくても大丈夫です。</span>わかる範囲でご記入ください。空欄のままでも送信できます。
            </p>

            <form id="intake-form">
                <div class="section-title px">▶ 基本情報</div>

                <div class="input-group">
                    <label>お名前・呼び名</label>
                    <input type="text" id="name" placeholder="表示してほしいお名前" required>
                </div>

                <div class="input-group">
                    <label>ご連絡先</label>
                    <input type="text" id="contact" placeholder="メール / X ID / Discord など" required>
                </div>

                <div class="input-group">
                    <label>活動内容<span class="optional">(任意)</span></label>
                    <input type="text" id="activity" placeholder="例: VTuber / エンジニア / 学生 など">
                </div>

                <div class="input-group">
                    <label>肩書き<span class="optional">(任意)</span>
                        <span class="hint">ゲーム風にアレンジもできます(例: フリーランス → 孤高の探索者)。希望があれば書いてください</span>
                    </label>
                    <input type="text" id="jobTitle" placeholder="そのままでも、ゲーム風でもOK">
                </div>

                <div class="section-title px">▶ このサイトの目的</div>

                <div class="input-group">
                    <label>何のために使いますか<span class="optional">(任意)</span>
                        <span class="hint">例: 名刺代わりに見せたい / 仕事の依頼を増やしたい / ファンに楽しんでほしい</span>
                    </label>
                    <input type="text" id="sitePurpose" placeholder="一番の目的をひとつ">
                </div>

                <div class="input-group">
                    <label>誰に見てほしいですか<span class="optional">(任意)</span>
                        <span class="hint">例: 企業の採用担当 / VTuberのファン / 同業のクリエイター</span>
                    </label>
                    <input type="text" id="targetAudience" placeholder="見せたい相手">
                </div>

                <div class="input-group">
                    <label>一番強調したい強み<span class="optional">(任意)</span>
                        <span class="hint">ここが一番目立つ場所に入ります</span>
                    </label>
                    <input type="text" id="strength" placeholder="例: 技術力 / キャラクター性 / 実績の多さ">
                </div>

                <div class="section-title px">▶ 世界観・ビジュアル</div>

                <div class="input-group">
                    <label>モチーフにしたい作品・世界観<span class="optional">(任意)</span>
                        <span class="hint">例: FF14風、MOTHER2風、特に希望なければ空欄でOK</span>
                    </label>
                    <input type="text" id="themeRef" placeholder="お気に入りのゲーム・作品があれば">
                </div>

                <div class="input-group">
                    <label>特に再現したい「画面」<span class="optional">(任意)</span>
                        <span class="hint">作品名より具体的だと精度が上がります(例: MOTHER2の戦闘画面、ドラクエVの結婚式、ペルソナ5のメニュー)</span>
                    </label>
                    <input type="text" id="themeScreen" placeholder="思い浮かぶ画面があれば">
                </div>

                <div class="input-group">
                    <label>デザインの方向性<span class="optional">(任意)</span></label>
                    <select id="designStyle">
                        <option value="">おまかせ</option>
                        <option value="完全レトロなドット絵">完全レトロなドット絵</option>
                        <option value="現代的なHDリマスター風">現代的なHDリマスター風</option>
                        <option value="スタイリッシュなUI">スタイリッシュなUI</option>
                        <option value="かわいい・ポップ">かわいい・ポップ</option>
                        <option value="ダーク・かっこいい">ダーク・かっこいい</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>使いたい色<span class="optional">(任意)</span></label>
                    <input type="text" id="colorPref" placeholder="例: 赤と黒、パステル、推しカラーの水色 など">
                </div>

                <div class="input-group">
                    <label>背景の希望<span class="optional">(任意)</span></label>
                    <input type="text" id="backgroundPref" placeholder="例: 単色、星空、スクロールする模様、特定の景色">
                </div>

                <div class="section-title px">▶ SNS・リンク</div>

                <div class="input-group">
                    <label>X (Twitter)<span class="optional">(任意)</span></label>
                    <input type="text" id="snsX" placeholder="@ID または URL">
                </div>

                <div class="input-group">
                    <label>YouTube<span class="optional">(任意)</span></label>
                    <input type="text" id="snsYoutube" placeholder="チャンネルURL">
                </div>

                <div class="input-group">
                    <label>Instagram / TikTok<span class="optional">(任意)</span></label>
                    <input type="text" id="snsIgTiktok" placeholder="あるものだけでOK">
                </div>

                <div class="input-group">
                    <label>その他のリンク<span class="optional">(任意)</span>
                        <span class="hint">Twitch, pixiv, BOOTH, ブログ, 通販ページなど。改行で複数どうぞ</span>
                    </label>
                    <textarea id="snsOther" rows="3" placeholder="載せたいリンクを自由に"></textarea>
                </div>

                <div class="input-group">
                    <label>お問い合わせ先<span class="optional">(任意)</span>
                        <span class="hint">サイトに載せる連絡先。上のご連絡先と違う場合だけ書いてください</span>
                    </label>
                    <input type="text" id="publicContact" placeholder="公開してよい連絡先">
                </div>

                <div class="section-title px">▶ 人となり</div>

                <div class="input-group">
                    <label>キャッチコピー・特技<span class="optional">(任意)</span></label>
                    <input type="text" id="catchphrase" placeholder="一言で自分を表すなら？">
                </div>

                <div class="input-group">
                    <label>自己紹介<span class="optional">(任意)</span>
                        <span class="hint">200文字くらいの概要。プロフィール欄にそのまま使います</span>
                    </label>
                    <textarea id="bio" rows="4" placeholder="どんな人で、何をしているか"></textarea>
                </div>

                <div class="input-group">
                    <label>活動歴<span class="optional">(任意)</span>
                        <span class="hint">LVの設定に使います(例: 3年目、2023年から)</span>
                    </label>
                    <input type="text" id="careerLength" placeholder="いつから活動しているか">
                </div>

                <div class="input-group">
                    <label>誕生日<span class="optional">(任意)</span></label>
                    <input type="text" id="birthday" placeholder="例: 8月30日">
                </div>

                <div class="input-group">
                    <label>好きなもの・趣味<span class="optional">(任意)</span></label>
                    <textarea id="likes" rows="2" placeholder="食べ物、ペット、ゲームなど"></textarea>
                </div>

                <div class="input-group">
                    <label>ちょっとした秘密ネタ<span class="optional">(任意)</span>
                        <span class="hint">深掘りしすぎない「気になる話題」があれば</span>
                    </label>
                    <input type="text" id="secretTopic" placeholder="なくてもOK">
                </div>

                <div class="section-title px">▶ 実績・目標</div>

                <div class="input-group">
                    <label>実績、または今後の目標<span class="optional">(任意)</span>
                        <span class="hint">活動が浅い方・学生の方は「実績」ではなく「これからの目標」で構いません(例: 初配信をする、フォロワー100人 など)</span>
                    </label>
                    <textarea id="achievements" rows="3" placeholder="実績でも目標でも、書きやすい方でOK"></textarea>
                </div>

                <div class="input-group">
                    <label>登録者・フォロワーの目標人数<span class="optional">(任意)</span></label>
                    <input type="text" id="subscriberGoal" placeholder="例: 2000人 (達成演出を入れたい場合)">
                </div>

                <div class="input-group">
                    <label>ぜひ載せたい実績・受賞歴<span class="optional">(任意)</span>
                        <span class="hint">出演、コラボ、大会成績、メディア掲載など。誇っていいものは全部書いてください</span>
                    </label>
                    <textarea id="highlights" rows="3" placeholder="1つずつ改行で"></textarea>
                </div>

                <div class="input-group">
                    <label>メニュー・料金表<span class="optional">(任意)</span>
                        <span class="hint">依頼を受けている方向け。載せたい場合だけ</span>
                    </label>
                    <textarea id="priceMenu" rows="3" placeholder="例: イラスト1枚 ○○円"></textarea>
                </div>

                <div class="input-group">
                    <label>その他、絶対に載せたい情報<span class="optional">(任意)</span>
                        <span class="hint">上のどこにも当てはまらないが、必ず入れてほしいもの</span>
                    </label>
                    <textarea id="mustInclude" rows="3" placeholder="何でもどうぞ"></textarea>
                </div>

                <!-- ここから下は「ゲーム化」に直結する項目。
                     HEARING_SHEET.md にある制作必須の設問のうち、依頼者が自分で答えられる
                     ものだけをフォームに落としてある。ここが埋まっていると、こちらで
                     ステータスやスキルを考える工程が丸ごと不要になり、制作が大幅に早くなる。
                     全て任意にしてあるのは、空欄でもこちらで「翻訳」して提案できるため。 -->
                <div class="section-title px">▶ ゲーム化の材料</div>

                <div class="input-group">
                    <label>ステータスにしたい数字<span class="optional">(任意)</span>
                        <span class="hint">LV・HP・こうげき力などに変換します(例: 活動年数3年 → LV3、配信時間1200時間、制作本数50本 など)</span>
                    </label>
                    <textarea id="statusNumbers" rows="3" placeholder="数字にできるものがあれば何でも"></textarea>
                </div>

                <div class="input-group">
                    <label>とくぎ・スキル（最大5つ）<span class="optional">(任意)</span>
                        <span class="hint">名前と、クリックしたときに出る説明文をセットでいただけると、そのまま使えます(例: 「早口ことば」→ 3分間で50個の早口を成功させる)</span>
                    </label>
                    <textarea id="skills" rows="4" placeholder="1つずつ改行で。説明はなくてもOK"></textarea>
                </div>

                <div class="input-group">
                    <label>そうびアイテム（最大4つ）<span class="optional">(任意)</span>
                        <span class="hint">愛用の機材・小物など。「いつも使っているマイク」「相棒のペン」程度で構いません。説明文はこちらで書きます</span>
                    </label>
                    <textarea id="equipment" rows="3" placeholder="例: コンデンサーマイク、赤いヘッドホン"></textarea>
                </div>

                <div class="input-group">
                    <label>入れたい しかけ・隠しコマンド<span class="optional">(任意)</span>
                        <span class="hint">「ロゴを5回押すとキャラが喋る」など。思いつかなければ空欄でOK、こちらから3〜10個提案します</span>
                    </label>
                    <textarea id="gimmick" rows="3" placeholder="やってみたい演出があれば"></textarea>
                </div>

                <div class="input-group">
                    <label>立ち絵について<span class="optional">(任意)</span>
                        <span class="hint">ドット絵に変換してほしい等の希望があれば</span>
                    </label>
                    <input type="text" id="characterArt" placeholder="例: 背景透過のPNGあり / ドット絵にしてほしい / なし">
                </div>

                <!-- 画像の添付。
                     Firebase Storage がこのプロジェクトでは未設定のため、ブラウザ側で
                     縮小(最大1000px/JPEG)してから Firestore の同じドキュメントに
                     data URL として埋め込んでいる。Firestoreの1ドキュメント上限が1MBのため、
                     合計サイズを監視して超えそうなら送信を止める。
                     ここで受け取るのは「どんな絵か」を把握するための確認用。
                     制作に使う原寸データは、やり取りの中で別途もらう前提。 -->
                <div class="section-title px">▶ 使いたい画像</div>

                <div class="input-group">
                    <label>画像を添付<span class="optional">(任意)</span>
                        <span class="hint">立ち絵・ロゴ・背景・参考にしたい画面など、最大4枚まで。
                        送信しやすいよう自動で縮小します。原寸のデータは、あとのやり取りで送っていただければ大丈夫です</span>
                    </label>
                    <label for="imageInput" class="file-btn px">＋ 画像をえらぶ</label>
                    <input type="file" id="imageInput" accept="image/*" multiple hidden>
                    <div id="image-previews"></div>
                    <div id="image-status" class="hint"></div>
                </div>

                <div class="input-group">
                    <label>画像の説明<span class="optional">(任意)</span>
                        <span class="hint">どれが何の画像か書いておいていただけると助かります</span>
                    </label>
                    <textarea id="imageNote" rows="2" placeholder="例: 1枚目が立ち絵、2枚目がロゴ"></textarea>
                </div>

                <div class="section-title px">▶ その他</div>

                <div class="input-group">
                    <label>BGMの希望<span class="optional">(任意)</span></label>
                    <input type="text" id="bgmNote" placeholder="使いたい曲、なければ空欄でOK">
                </div>

                <div class="input-group">
                    <label>ご予算<span class="optional">(任意)</span></label>
                    <input type="text" id="budget" placeholder="目安で構いません">
                </div>

                <div class="input-group">
                    <label>納期希望<span class="optional">(任意)</span></label>
                    <input type="text" id="deadline" placeholder="例: 特になし / 〇月中希望">
                </div>

                <div class="input-group">
                    <label>自由記述<span class="optional">(任意)</span></label>
                    <textarea id="freeNote" rows="3" placeholder="その他伝えたいことがあれば"></textarea>
                </div>

                <input type="hidden" id="referrer">
                <button type="submit" class="submit-btn" id="submit-btn">▶ データを おくる</button>
            </form>

            <a href="javascript:history.back()" class="back-link">▶ もどる</a>
        </div>
    </div>

    <div id="success-overlay">
        <div class="mother-window" style="max-width: 350px; margin: 0;">
            <div class="mother-window-inner">
                <p>データを 登録しました！<br><br>のちほど こちらから<br>ご連絡いたします。 おたのしみに！</p>
                <button onclick="window.location.href='../'" class="submit-btn">▶ TOPへ もどる</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDlovNerE44bGykzWDJkqmoD4fbSHnzveI",
          authDomain: "hexa-relation.firebaseapp.com",
          projectId: "hexa-relation",
          storageBucket: "hexa-relation.firebasestorage.app",
          messagingSenderId: "318065017750",
          appId: "1:318065017750:web:94acf3c9c43632b3ff93b7",
          measurementId: "G-15NM9TWFE2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('referrer').value = urlParams.get('ref') || urlParams.get('from') || 'ちょくせつ';

        const form = document.getElementById('intake-form');
        const submitBtn = document.getElementById('submit-btn');
        let isSubmitting = false;

        const FIELD_IDS = [
            'name', 'contact', 'activity', 'jobTitle',
            'sitePurpose', 'targetAudience', 'strength',
            'themeRef', 'themeScreen', 'designStyle', 'colorPref', 'backgroundPref',
            'snsX', 'snsYoutube', 'snsIgTiktok', 'snsOther', 'publicContact',
            'catchphrase', 'bio', 'careerLength', 'birthday', 'likes', 'secretTopic',
            'achievements', 'subscriberGoal', 'highlights', 'priceMenu', 'mustInclude',
            'statusNumbers', 'skills', 'equipment', 'gimmick', 'characterArt',
            'imageNote', 'bgmNote', 'budget', 'deadline', 'freeNote', 'referrer'
        ];

        /* ===== 画像の添付 =====
           Firebase Storage が未設定のため、ブラウザ側で縮小して data URL にし、
           Firestore の同じドキュメントへ埋め込む。1ドキュメント1MBの上限があるので、
           合計サイズを常時監視して超える追加を受け付けない。 */
        const MAX_IMAGES = 4;
        const MAX_EDGE = 1000;          // 長辺の上限(px)
        const JPEG_QUALITY = 0.75;
        const TOTAL_BUDGET = 700 * 1024; // data URLの合計上限。1MB制限に対する安全域
        const images = [];

        const imageInput = document.getElementById('imageInput');
        const previews = document.getElementById('image-previews');
        const imageStatus = document.getElementById('image-status');

        function shrink(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('読み込みに失敗しました'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('画像として開けませんでした'));
                    img.onload = () => {
                        const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        const ctx = canvas.getContext('2d');
                        // 透過PNGをJPEGにすると背景が黒くなるため、白で埋めてから描く
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function totalBytes() {
            return images.reduce((n, i) => n + i.dataUrl.length, 0);
        }

        function renderPreviews() {
            previews.innerHTML = '';
            images.forEach((item, idx) => {
                const box = document.createElement('div');
                box.className = 'thumb';
                const img = document.createElement('img');
                img.src = item.dataUrl;
                img.alt = item.name;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'remove';
                btn.textContent = '×';
                btn.setAttribute('aria-label', `${item.name} を外す`);
                btn.onclick = () => { images.splice(idx, 1); renderPreviews(); };
                const cap = document.createElement('div');
                cap.className = 'cap';
                cap.textContent = item.name;
                box.append(img, btn, cap);
                previews.appendChild(box);
            });
            const kb = Math.round(totalBytes() / 1024);
            imageStatus.textContent = images.length
                ? `${images.length} / ${MAX_IMAGES}枚 (約${kb}KB)`
                : '';
            imageStatus.classList.remove('over');
        }

        imageInput.addEventListener('change', async () => {
            const files = Array.from(imageInput.files || []);
            imageInput.value = ''; // 同じファイルを選び直せるようにする
            for (const file of files) {
                if (images.length >= MAX_IMAGES) {
                    imageStatus.textContent = `画像は ${MAX_IMAGES}枚までです。`;
                    imageStatus.classList.add('over');
                    break;
                }
                try {
                    const dataUrl = await shrink(file);
                    if (totalBytes() + dataUrl.length > TOTAL_BUDGET) {
                        imageStatus.textContent =
                            'これ以上は容量オーバーです。枚数を減らすか、残りはあとで送ってください。';
                        imageStatus.classList.add('over');
                        break;
                    }
                    images.push({ name: file.name, dataUrl });
                    renderPreviews();
                } catch (err) {
                    console.error('画像の処理に失敗:', file.name, err);
                    imageStatus.textContent = `「${file.name}」は読み込めませんでした。`;
                    imageStatus.classList.add('over');
                }
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSubmitting) return;
            isSubmitting = true;
            submitBtn.disabled = true;
            submitBtn.innerText = '▶ そうしんちゅう...';

            const data = {};
            FIELD_IDS.forEach(id => { data[id] = document.getElementById(id).value.trim(); });
            data.images = images;
            data.imageCount = images.length;
            data.timestamp = firebase.firestore.FieldValue.serverTimestamp();

            try {
                await db.collection('client_intake').add(data);
                document.getElementById('success-overlay').style.display = 'flex';
            } catch (err) {
                console.error('Intake submit error:', err);
                alert('送信中に エラーが おきました。時間をおいて お試しください。');
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.innerText = '▶ データを おくる';
            }
        });
    </script>
</body>
</html>
