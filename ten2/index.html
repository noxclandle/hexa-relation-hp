<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>てん / TENPON</title>
<meta name="description" content="てん（TENPON）の配信スケジュールとお知らせ。いま配信しているか、次はいつかが、ここでわかります。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.hexa-relation.com/ten2/">
<meta property="og:title" content="てん / TENPON">
<meta property="og:description" content="配信スケジュールとお知らせ。">
<meta property="og:image" content="https://www.hexa-relation.com/ten2/img/hero.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@300;500&family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   ten2 design system  ―  OPTICAL WHITE
   書体2（和文/欧文・数字）/ サイズ5 / 文字色4 / 角丸0 / 余白は8の倍数
   色は全て地色 #F6F7F9 に対するコントラスト比を実測して決めている。
   --faint は罫線と非活性専用。情報を載せてはいけない（3.21:1）。
   =================================================================== */
:root{
  /* 面 */
  --base:#F6F7F9;   /* 立ち絵の主要白 #F0F0F0 に対し 1.06:1。地をわずかに明るくして輪郭を残す */
  --panel:#EEF1F5;
  --rule:#D6DBE2;
  /* 文字色 ― この4つ以外は使わない */
  --ink:#1E2430;    /* 14.51:1 */
  --sub:#656D7A;    /*  4.87:1  本文・補助文 */
  --accent:#1F4FA8; /*  7.14:1  白ヌキで 7.66:1。てんの瞳 #204888 由来 */
  --faint:#828B9A;  /*  3.21:1  罫線・非活性のみ */
  /* 回折の分光（明度を95〜97%に固定してあるので、回しても文字の可読性が動かない） */
  --p1:oklch(96% .045 20); --p2:oklch(96% .040 60); --p3:oklch(97% .030 150);
  --p4:oklch(96% .045 230); --p5:oklch(95% .050 285);
  /* サイズ ― この5つ以外は使わない */
  --s1:12px; --s2:15px; --s3:17px; --s4:30px; --sd:clamp(104px,15vw,200px);
  /* 余白 ― 8の倍数以外は使わない */
  --x1:8px; --x2:16px; --x3:24px; --x4:40px; --x5:64px; --x6:96px; --x7:160px; --x8:192px;
}
:root[data-theme="birthday"] { --accent:#A3355F; --p1:oklch(96% .050 10);  --p2:oklch(96% .042 340); --p3:oklch(97% .030 300); --p4:oklch(96% .038 40);  --p5:oklch(96% .045 70); }
:root[data-theme="sakura"]   { --accent:#A63A63; --p1:oklch(96% .048 355); --p2:oklch(97% .034 330); --p3:oklch(97% .028 120); --p4:oklch(96% .036 60);  --p5:oklch(96% .040 20); }
:root[data-theme="summer"]   { --accent:#1F6F7A; --p1:oklch(96% .044 220); --p2:oklch(97% .038 180); --p3:oklch(97% .034 140); --p4:oklch(96% .040 90);  --p5:oklch(96% .036 260); }
:root[data-theme="autumn"]   { --accent:#8A4A1B; --p1:oklch(96% .046 55);  --p2:oklch(96% .040 35);  --p3:oklch(97% .030 80);  --p4:oklch(96% .034 20);  --p5:oklch(96% .038 95); }
:root[data-theme="halloween"]{ --accent:#6B3F8F; --p1:oklch(96% .046 60);  --p2:oklch(96% .042 300); --p3:oklch(97% .030 320); --p4:oklch(96% .038 40);  --p5:oklch(95% .046 285); }
:root[data-theme="christmas"]{ --accent:#1F6B45; --p1:oklch(96% .040 150); --p2:oklch(96% .044 20);  --p3:oklch(97% .028 120); --p4:oklch(96% .036 5);   --p5:oklch(96% .034 165); }
:root[data-theme="newyear"]  { --accent:#8A6420; --p1:oklch(97% .040 85);  --p2:oklch(96% .036 60);  --p3:oklch(96% .040 20);  --p4:oklch(97% .030 100); --p5:oklch(96% .034 45); }
:root[data-theme="snow"]     { --accent:#3A5A80; --p1:oklch(97% .028 230); --p2:oklch(97% .022 260); --p3:oklch(97% .020 300); --p4:oklch(97% .026 200); --p5:oklch(97% .024 250); }
:root[data-theme="rain"]     { --accent:#40566B; --p1:oklch(96% .026 240); --p2:oklch(97% .022 190); --p3:oklch(97% .024 280); --p4:oklch(96% .020 210); --p5:oklch(97% .022 260); }
:root[data-theme="night"]    { --accent:#3F3F8C; --p1:oklch(96% .038 285); --p2:oklch(96% .034 300); --p3:oklch(96% .030 250); --p4:oklch(96% .036 330); --p5:oklch(96% .032 270); }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--base); color:var(--ink);
  font-family:'M PLUS 2','Hiragino Sans','Noto Sans JP',sans-serif;
  font-weight:300; font-size:var(--s3); line-height:2.05; letter-spacing:.04em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
/* 欧文と数字だけを別書体にする。これが「無機の器 / 有機の中身」の実装 */
.mono{font-family:'Space Grotesk','Helvetica Neue',sans-serif;font-weight:300;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ===== 回折 ― シャボン玉（薄膜干渉）の一つ先 ===== */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.optic{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.prism{
  position:absolute;inset:-20%;
  background:linear-gradient(var(--ang),
    var(--p1) 0%, var(--p2) 22%, var(--p3) 45%, var(--p4) 68%, var(--p5) 88%, var(--p1) 100%);
  filter:blur(64px); mix-blend-mode:multiply; opacity:.30;
  animation:spin 180s linear infinite;
}
.ring{
  position:absolute;aspect-ratio:1;
  background:conic-gradient(from 200deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p1));
  -webkit-mask:radial-gradient(circle at 50% 50%,transparent 0 46%,#000 47% 48.4%,transparent 49.6%);
          mask:radial-gradient(circle at 50% 50%,transparent 0 46%,#000 47% 48.4%,transparent 49.6%);
  filter:blur(.6px); opacity:.55; animation:spin 240s linear infinite;
}
.ring.o{-webkit-mask:radial-gradient(circle at 50% 50%,transparent 0 61%,#000 62% 63%,transparent 64%);
                mask:radial-gradient(circle at 50% 50%,transparent 0 61%,#000 62% 63%,transparent 64%);opacity:.3}
@keyframes spin{to{--ang:360deg;transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){ .prism,.ring{animation:none} }

.wrap{max-width:1080px;margin:0 auto;padding:0 var(--x5);position:relative;z-index:3}
section{position:relative}
.sec{padding-bottom:var(--x8)}
.hero + .sec{padding-top:var(--x8)}
.label{font-size:var(--s1);letter-spacing:.28em;color:var(--sub);margin-bottom:var(--x4)}
.rise{opacity:0;transform:translateY(12px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.rise.in{opacity:1;transform:none}

/* hero */
.hero{min-height:100svh;display:flex;align-items:center;overflow:hidden}
.fig{position:absolute;right:var(--x5);bottom:0;height:88svh;width:auto;z-index:2;pointer-events:none}
.fig.framed{right:var(--x3);bottom:auto;top:50%;transform:translateY(-50%);height:auto;width:min(46vw,560px)}
.mark{position:relative;display:inline-block}
.sup{font-size:var(--s1);letter-spacing:.3em;color:var(--sub);margin-bottom:var(--x2)}
/* 巨大数字・名前にだけ、極小の分散（プリズム収差）を乗せる。本文には絶対に使わない */
.big{font-size:var(--sd);line-height:1;letter-spacing:.02em;display:block;
  text-shadow:.6px 0 0 rgba(224,96,96,.22),-.6px 0 0 rgba(64,112,232,.22)}
.greet{margin-top:var(--x3);font-size:var(--s3);letter-spacing:.1em;max-width:22em}
.status{margin-top:var(--x5)}
.stRow{display:flex;align-items:center;gap:var(--x2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
.status.on .dot{background:var(--accent);box-shadow:0 0 0 8px rgba(31,79,168,.12);animation:breathe 3.6s ease-in-out infinite}
.stMain{font-size:var(--s3)}
.stSub{margin-top:var(--x1);margin-left:var(--x3);font-size:var(--s2);color:var(--sub)}
.stSub b{font-weight:500;color:var(--ink)}
/* 当たり判定を44pxまで広げる */
.link{display:inline-block;padding:12px 0;font-size:var(--s2);color:var(--accent);
  box-shadow:inset 0 -1px 0 rgba(31,79,168,.4)}
.stGo{margin-left:var(--x3)}
.scroll{position:absolute;right:var(--x5);bottom:var(--x4);z-index:4;font-size:var(--s1);letter-spacing:.3em;color:var(--sub)}

/* today */
.todayIn{display:grid;grid-template-columns:auto 1fr;gap:0 var(--x6);align-items:start}
.bigdate{font-size:var(--sd);line-height:1;color:var(--accent);opacity:.34;
  text-shadow:.6px 0 0 rgba(224,96,96,.18),-.6px 0 0 rgba(64,112,232,.18)}
.bigdate small{display:block;font-size:var(--s1);letter-spacing:.3em;color:var(--sub);margin-top:var(--x3);opacity:1;text-shadow:none}
.msg{font-size:var(--s4);line-height:1.85;letter-spacing:.04em}
.tdBody{margin-top:var(--x3);font-size:var(--s2);color:var(--sub)}

/* 時刻の尺 ― 飾りではなく情報。いまどこにいて、次の枠まであとどれだけか */
.scaleWrap{margin-bottom:var(--x5)}
.scale{position:relative;height:56px;
  background:
    repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px calc(100%/24)),
    repeating-linear-gradient(90deg,var(--faint) 0 1px,transparent 1px calc(100%/4));
  background-size:100% 12px,100% 24px;background-position:0 bottom,0 bottom;background-repeat:no-repeat}
.scale .band{position:absolute;bottom:0;height:24px;background:var(--accent);opacity:.22}
.scale .now{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);
  transition:left .3s cubic-bezier(.2,.7,.3,1)}
.scale .now::after{content:'';position:absolute;top:0;left:-2px;width:5px;height:5px;background:var(--accent)}
.scaleTicks{display:flex;justify-content:space-between;margin-top:var(--x1);
  font-size:var(--s1);letter-spacing:.2em;color:var(--sub)}

/* schedule */
.week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:var(--x6)}
.day{padding:var(--x3) var(--x1);text-align:center}
.day.has{background:linear-gradient(180deg,transparent,var(--panel) 22%,transparent 96%)}
.day.today{box-shadow:inset 0 2px 0 var(--accent)}
.dName{font-size:var(--s1);letter-spacing:.24em;color:var(--sub);margin-bottom:var(--x2)}
.day.today .dName{color:var(--accent);font-weight:500}
.dTime{font-size:var(--s3)}
.dLabel{font-size:var(--s1);color:var(--sub);margin-top:var(--x1);line-height:1.8}
.dNone{font-size:var(--s2);color:var(--sub)}
.upList li{display:grid;grid-template-columns:224px 1fr;gap:0 var(--x4);padding:var(--x3) 0;align-items:baseline}
.upList li + li{box-shadow:inset 0 1px 0 var(--rule)}
.upDate{font-size:var(--s2);color:var(--sub);white-space:nowrap}
.upTitle{font-size:var(--s3)}
.upTitle a:hover{color:var(--accent)}
.note{margin-top:var(--x4);font-size:var(--s2);color:var(--sub)}
.empty{font-size:var(--s2);color:var(--sub)}

/* about */
.firstGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--x6)}
.vid{aspect-ratio:16/9;position:relative;background:var(--panel)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.firstTx p{font-size:var(--s2);color:var(--sub);max-width:22em}

/* おたより */
.form{max-width:600px}
.form .hint{font-size:var(--s2);color:var(--sub);margin-bottom:var(--x5)}
.form label{display:block;font-size:var(--s1);letter-spacing:.28em;color:var(--sub);margin-bottom:var(--x1)}
.form input,.form textarea{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--faint);
  padding:var(--x1) 0 var(--x2);margin-bottom:var(--x4);
  font-family:inherit;font-weight:300;font-size:var(--s3);letter-spacing:.04em;line-height:2.05;color:var(--ink);
  outline:none;transition:border-color .3s}
.form textarea{min-height:112px;resize:vertical}
.form input:focus,.form textarea:focus{border-bottom-color:var(--accent)}
.send{border:0;background:var(--accent);color:#fff;padding:var(--x2) var(--x4);
  font-family:inherit;font-size:var(--s2);letter-spacing:.18em;cursor:pointer;transition:opacity .3s}
.send:hover{opacity:.86}
.send:disabled{opacity:.4;cursor:default}
.sent{margin-top:var(--x3);font-size:var(--s2);color:var(--accent);min-height:24px}

/* links */
.chibi{position:absolute;right:0;bottom:calc(var(--x3) * -1);width:160px;height:auto;opacity:.9;pointer-events:none}
.ul{display:grid;grid-template-columns:repeat(4,minmax(0,152px));gap:var(--x4)}
.ul .en{font-size:var(--s1);letter-spacing:.28em;color:var(--sub);display:block;margin-bottom:var(--x1)}
.ul .jp{font-size:var(--s3)}
.ul a{display:block;padding:var(--x1) 0}
.ul a:hover .jp{color:var(--accent)}
.foot{font-size:var(--s1);letter-spacing:.3em;color:var(--sub);padding-bottom:var(--x6)}

@media(max-width:820px){
  :root{--sd:clamp(76px,21vw,132px)}
  .wrap{padding:0 var(--x3)}
  .sec{padding-bottom:var(--x6)}
  .hero + .sec{padding-top:var(--x6)}
  .fig{height:46svh;right:calc(var(--x5) * -1);opacity:.62;z-index:0}
  .fig.framed{width:88vw;right:calc(var(--x5) * -1);top:34%;opacity:.5}
  .hero{padding:var(--x5) 0;align-items:center}
  .todayIn{grid-template-columns:1fr;gap:var(--x3)}
  .scale{height:40px}
  .day{padding:var(--x2) 0 var(--x3)}
  .dName{letter-spacing:.08em;margin-bottom:var(--x1)}
  .dTime{font-size:var(--s2)}
  .dLabel{display:none}
  .upList li{grid-template-columns:1fr;gap:var(--x1)}
  .firstGrid{grid-template-columns:1fr;gap:var(--x4)}
  .ul{grid-template-columns:repeat(2,1fr);gap:var(--x3)}
  .chibi{width:104px;opacity:.5}
  .scroll{display:none}
}
</style>
</head>
<body>

<section class="hero">
  <div class="optic">
    <div class="prism"></div>
    <div class="ring"   style="width:min(72vw,760px);right:-10vw;top:12vh"></div>
    <div class="ring o" style="width:min(46vw,480px);left:-8vw;bottom:-6vw"></div>
  </div>
  <img class="fig" src="img/hero.webp" alt="" id="fig" width="488" height="1300" fetchpriority="high" decoding="async">
  <div class="wrap">
    <div class="mark rise">
      <p class="sup mono" id="sup">TENPON / YOUTUBE</p>
      <span class="big mono" id="nameEn">ten</span>
      <p class="greet" id="greeting"></p>
      <div class="status off" id="status">
        <div class="stRow"><span class="dot"></span><span class="stMain" id="stMain">確認しています…</span></div>
        <p class="stSub" id="stSub"></p>
        <a class="link stGo" id="stGo" style="display:none" target="_blank" rel="noopener">配信を見に行く</a>
      </div>
    </div>
  </div>
  <p class="scroll mono">SCROLL</p>
</section>

<section class="sec">
  <div class="optic">
    <div class="prism" style="animation-duration:210s"></div>
    <div class="ring" style="width:min(40vw,420px);right:6vw;top:-8vw;opacity:.4"></div>
  </div>
  <div class="wrap todayIn rise">
    <p class="bigdate mono" id="bigDay">–<small id="bigMon"></small></p>
    <div>
      <p class="label"><span class="mono">TODAY</span>　おしらせ</p>
      <p class="msg" id="tdMsg"></p>
      <p class="tdBody" id="tdBody" style="display:none"></p>
      <a class="link" id="tdLink" style="display:none" target="_blank" rel="noopener"></a>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <p class="label rise"><span class="mono">SCHEDULE</span>　配信スケジュール</p>
    <div class="scaleWrap rise">
      <div class="scale" id="scale"><span class="now" id="nowmark" style="left:0"></span></div>
      <div class="scaleTicks mono"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
    </div>
    <div class="week rise" id="week"></div>
    <p class="label rise"><span class="mono">UPCOMING</span>　これからの配信</p>
    <ul class="upList rise" id="upcoming"></ul>
    <p class="note rise" id="schedNote" style="display:none"></p>
  </div>
</section>

<section class="sec" id="aboutSec" style="display:none">
  <div class="wrap">
    <p class="label rise"><span class="mono">ABOUT</span>　てんについて</p>
    <div class="firstGrid rise">
      <div class="vid" id="vid" style="display:none"></div>
      <div class="firstTx"><p id="about"></p></div>
    </div>
  </div>
</section>

<section class="sec">
  <div class="optic">
    <div class="prism" style="animation-duration:240s"></div>
    <div class="ring" style="width:min(34vw,360px);right:10vw;top:18%;opacity:.42"></div>
  </div>
  <div class="wrap">
    <p class="label rise"><span class="mono">MESSAGE</span>　おたより</p>
    <div class="form rise">
      <p class="hint">感想でも、質問でも。<br>返事は配信の中でするかもしれません。</p>
      <label>なまえ（なくても大丈夫）</label>
      <input id="mName" maxlength="40" autocomplete="off">
      <label>ないよう</label>
      <textarea id="mBody" maxlength="1000"></textarea>
      <button class="send" id="mSend">おくる</button>
      <p class="sent" id="mSent"></p>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap rise" style="position:relative">
    <img class="chibi" src="img/chibi_frill.webp" alt="" width="379" height="760" loading="lazy" decoding="async">
    <p class="label mono">LINKS</p>
    <ul class="ul" id="links"></ul>
  </div>
</section>

<footer><div class="wrap"><p class="foot mono">TENPON</p></div></footer>

<script>
(function(){
  "use strict";
  var CH_START = 2023;
  var PROJ = 'hexa-relation';
  var KEY  = 'AIzaSyDlovNerE44bGykzWDJkqmoD4fbSHnzveI';
  var FS   = 'https://firestore.googleapis.com/v1/projects/'+PROJ+'/databases/(default)/documents/';
  var J = function(p){ return fetch(p+'?t='+Date.now()).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); };

  var now = new Date();
  var MM = ('0'+(now.getMonth()+1)).slice(-2), DD = ('0'+now.getDate()).slice(-2);
  var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var WD  = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var WDJ = ['日','月','火','水','木','金','土'];

  document.getElementById('bigDay').firstChild.nodeValue = String(now.getDate());
  document.getElementById('bigMon').textContent = MON[now.getMonth()]+' '+now.getFullYear();

  function inRange(a,b){
    var t=MM+DD, s=a.slice(-5).replace('-',''), e=b.slice(-5).replace('-','');
    return s<=e ? (t>=s&&t<=e) : (t>=s||t<=e);
  }
  function match(when){
    if (when.indexOf('..')>-1){
      var p=when.split('..');
      if (p[0].length===10&&p[1].length===10){
        var td=now.getFullYear()+'-'+MM+'-'+DD;
        return td>=p[0]&&td<=p[1];
      }
      return inRange(p[0],p[1]);
    }
    if (when.length===10) return when===(now.getFullYear()+'-'+MM+'-'+DD);
    return when===MM+'-'+DD;
  }

  var board = fetch(FS+'ten_board/current').then(function(r){ return r.ok?r.json():null; })
    .then(function(d){ try{ return JSON.parse(d.fields.data.stringValue); }catch(e){ return null; } })
    .catch(function(){ return null; });

  Promise.all([ J('profile.json'), J('events.json'), J('schedule.json'), J('/save/ten/live_status.json'), board ])
  .then(function(res){
    var prof=res[0]||{}, ev=res[1]||{}, sc=res[2]||{}, live=res[3]||{}, bd=res[4];
    if (bd){
      if (bd.message) ev.message = bd.message;
      if (bd.schedule && bd.schedule.weekly) sc = bd.schedule;
    }

    if (prof.nameEn) document.getElementById('nameEn').textContent = prof.nameEn;
    if (prof.handle) document.getElementById('sup').textContent = prof.handle+' / YOUTUBE';
    if (prof.greeting) document.getElementById('greeting').textContent = prof.greeting;

    // 本人の言葉が無いものは、代筆せずに節ごと出さない
    var hasAbout = !!(prof.about && prof.about.length);
    var hasVideo = !!(prof.firstVideo && prof.firstVideo.id);
    if (hasAbout) document.getElementById('about').innerHTML = prof.about.join('<br>');
    if (hasVideo){
      var v=document.getElementById('vid'); v.style.display='';
      v.innerHTML='<iframe src="https://www.youtube.com/embed/'+prof.firstVideo.id+'" title="" allowfullscreen loading="lazy"></iframe>';
    }
    if (hasAbout || hasVideo){
      document.getElementById('aboutSec').style.display='';
      if (!hasVideo || !hasAbout) document.querySelector('#aboutSec .firstGrid').style.gridTemplateColumns='1fr';
    }
    if (prof.links) document.getElementById('links').innerHTML = prof.links.map(function(l){
      return '<li><a href="'+l.url+'" target="_blank" rel="noopener"><span class="en mono">'+l.en+'</span><span class="jp">'+l.jp+'</span></a></li>';
    }).join('');

    var list=ev.events||[], notice=null, season=null;
    for (var i=0;i<list.length;i++){
      if (!match(list[i].when)) continue;
      if (list[i].kind==='notice' && !notice) notice=list[i];
      if (list[i].kind==='season' && !season) season=list[i];
    }
    var pick = notice ? notice
      : (ev.message && ev.message.text) ? { title:ev.message.text, body:'', link:null }
      : season ? season : (ev.default||{title:'',body:''});

    if (pick.theme) document.documentElement.setAttribute('data-theme', pick.theme);
    document.getElementById('tdMsg').innerHTML =
      (pick.title||'').replace('{years}', String(now.getFullYear()-CH_START)).replace(/\n/g,'<br>');
    if (pick.body){ var b=document.getElementById('tdBody'); b.textContent=pick.body; b.style.display=''; }
    if (pick.link && pick.link.url){
      var a=document.getElementById('tdLink'); a.textContent=pick.link.label||'くわしく'; a.href=pick.link.url; a.style.display='';
    }
    if (pick.art==='kimono'){ var f=document.getElementById('fig'); f.src='img/kimono.webp'; f.classList.add('framed'); }

    var weekly=sc.weekly||[], hasWeekly=false, html='';
    for (var d=0; d<7; d++){
      var w=null;
      for (var k=0;k<weekly.length;k++) if (weekly[k].day===d) w=weekly[k];
      var on=!!(w&&w.time); if(on) hasWeekly=true;
      html += '<div class="day'+(on?' has':'')+(d===now.getDay()?' today':'')+'">'
           +  '<p class="dName">'+WDJ[d]+'</p>'
           +  (on ? '<p class="dTime mono">'+w.time+'</p>'+(w.label?'<p class="dLabel">'+w.label+'</p>':'') : '<p class="dNone">なし</p>')
           +  '</div>';
    }
    document.getElementById('week').innerHTML = html;

    var up=(sc.upcoming||[]).filter(function(u){ return !u.date || u.date >= (now.getFullYear()+'-'+MM+'-'+DD); })
      .sort(function(a,b){ return a.date<b.date?-1:1; }).slice(0,5);
    var ul=document.getElementById('upcoming');
    if (up.length){
      ul.innerHTML = up.map(function(u){
        var dt=new Date(u.date+'T00:00:00');
        var head=(dt.getMonth()+1)+'月'+dt.getDate()+'日（'+WDJ[dt.getDay()]+'）'+(u.time?'　'+u.time:'');
        var t=u.url?'<a href="'+u.url+'" target="_blank" rel="noopener">'+(u.title||'配信')+'</a>':(u.title||'配信');
        return '<li><p class="upDate mono">'+head+'</p><p class="upTitle">'+t+'</p></li>';
      }).join('');
    } else {
      ul.innerHTML = '<li style="grid-template-columns:1fr"><p class="empty">'
        + (hasWeekly?'今のところ、予定に入っている配信はありません。':'ここはまだ準備中です。')
        + '<br><a class="link" href="https://www.youtube.com/@TENpon_ch/streams" target="_blank" rel="noopener">'
        + 'YouTubeで配信予定を見る</a></p></li>';
    }
    if (sc.note){ var n=document.getElementById('schedNote'); n.textContent=sc.note; n.style.display=''; }

    // 時刻の尺（0〜24時）。いまどこにいて、次の枠まであとどれだけか
    (function(){
      var mark=document.getElementById('nowmark');
      function place(){
        var n=new Date();
        mark.style.left=((n.getHours()*60+n.getMinutes())/1440*100).toFixed(3)+'%';
      }
      place(); setInterval(place,60000);
      var todayW=null;
      for (var i=0;i<weekly.length;i++) if (weekly[i].day===now.getDay() && weekly[i].time) todayW=weekly[i];
      if (todayW){
        var hm=todayW.time.split(':'), st0=(+hm[0]*60+(+hm[1]||0))/1440*100;
        var b=document.createElement('span'); b.className='band';
        b.style.left=st0.toFixed(3)+'%'; b.style.width=(120/1440*100).toFixed(3)+'%';
        document.getElementById('scale').appendChild(b);
      }
    })();

    var st=document.getElementById('status'), main=document.getElementById('stMain'),
        sub=document.getElementById('stSub'), go=document.getElementById('stGo');
    if (live && live.isLive){
      st.className='status on'; main.textContent='いま、配信中です'; sub.textContent='';
      go.href = live.videoId ? 'https://www.youtube.com/watch?v='+live.videoId : 'https://www.youtube.com/@TENpon_ch/live';
      go.style.display='';
    } else {
      st.className='status off'; main.textContent='いまは、おやすみ中';
      if (up.length){
        var d0=new Date(up[0].date+'T00:00:00');
        sub.innerHTML='つぎは <b>'+(d0.getMonth()+1)+'月'+d0.getDate()+'日（'+WDJ[d0.getDay()]+'）'+(up[0].time?' '+up[0].time:'')+'</b> から';
      }
    }
  });

  /* ---- おたより送信 ---- */
  var btn=document.getElementById('mSend'), out=document.getElementById('mSent');
  btn.addEventListener('click', function(){
    var body=(document.getElementById('mBody').value||'').trim();
    if (!body){ out.textContent='ないようを書いてください。'; return; }
    btn.disabled=true; out.textContent='おくっています…';
    fetch(FS+'ten_inbox?key='+KEY, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fields:{
        name:      { stringValue:(document.getElementById('mName').value||'').trim().slice(0,40) },
        body:      { stringValue: body.slice(0,1000) },
        createdAt: { stringValue: new Date().toISOString() },
        read:      { booleanValue: false }
      }})
    }).then(function(r){
      if (!r.ok) throw 0;
      out.textContent='おくりました。ありがとうございます。';
      document.getElementById('mName').value=''; document.getElementById('mBody').value='';
    }).catch(function(){
      out.textContent='おくれませんでした。時間をおいてもう一度お願いします。';
      btn.disabled=false;
    });
  });

  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{ rootMargin:'0px 0px -10% 0px' });
  document.querySelectorAll('.rise').forEach(function(el,i){ el.style.transitionDelay=(i%4)*90+'ms'; io.observe(el); });
})();
</script>
</body>
</html>
