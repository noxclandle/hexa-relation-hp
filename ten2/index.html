<style>
/* ===================================================================
   ten2 design system
   書体2 / サイズ5 / 文字色4 / 角丸3段 / 余白は8の倍数
   可読性の保証条件：面はすべて --floor より明るいこと。
   文字のコントラストは --base ではなく --floor に対して測る。
   これで「淡い面をいくら重ねても文字比は下の表を下回らない」が成立する。
   --faint に情報を載せてはいけない（floor 3.34:1）。
   キャラ画像は「面」ではない。--floor 基準の保証は絵の上では成立しないので、
   文字の外接矩形とキャラ画像の外接矩形を重ねない。どうしても重ねるときは
   文字の下に不透明度100%の面(#FFFFFF)を敷く。--veil は使わない。
   キャラ側の opacity を下げて可読性を作らない。
   角丸の規則：半径 ÷ 部品の短辺 ≤ 0.25。999px は使わない。
   =================================================================== */
:root{
  /* 面 */
  --base:#FFEDF4;
  --surf:#FFDEEC;
  --band:#FFCEE4; --band2:#FFBEDB;                  /* 最暗面。文字比の基準 */
  --rule:#F3C3D8;
  --v-rose:#FFCEE4; --v-sky:#CFE6FB;
  /* 文字色 ― この4つ以外は使わない（対 --floor） */
  --ink:#593C4A;    /* 7.00:1 対 --band */
  --sub:#735965;    /* 4.54:1 */
  --accent:#B81467; /* 4.56:1 / 白ヌキ 6.30:1 */
  --faint:#8B7780;  /* 3.01:1 罫線・非活性のみ */
  /* 装飾専用。文字色ではない。使う要素は必ず aria-hidden にし、
     同じ情報を読める文字で別に置くこと */
  --deco:#CB3C83;
  /* サイズ */
  --s1:13px; --s2:15px; --s3:18px; --s4:30px; --sd:clamp(88px,12vw,184px);
  /* 余白 */
  --x1:8px; --x2:16px; --x3:24px; --x4:40px; --x5:64px; --x6:96px; --x7:160px;
  /* 角丸 */
  --r1:6px; --r2:12px; --r3:28px;
}


/* 季節テーマ：面(base/surf/band)ごと差し替える。文字比は各テーマの --band に対して実測済み
   ink 7.00〜7.13 / sub 4.52〜4.60 / accent 4.50〜4.63(白ヌキ 5.93〜6.31)
   faint 3.01〜3.06 / deco 3.30〜3.38（decoは24px以上または19px/700以上に限る） */
:root[data-theme="birthday"] { --base:#FEEEF0; --surf:#FEE0E3; --band:#FED1D6; --band2:#FDC2C9; --rule:#F6BFC6; --ink:#5C3C41; --sub:#76595D; --accent:#BF0F39; --faint:#8D7779; --deco:#D63B5A; --v-rose:#FED1D6; --v-sky:#D8E6FA }
:root[data-theme="sakura"]   { --base:#FEEDF6; --surf:#FEDEEF; --band:#FDCEE7; --band2:#FCBFDF; --rule:#F5BFDA; --ink:#573B4B; --sub:#725967; --accent:#B51771; --faint:#8A7781; --deco:#C93F8F; --v-rose:#FDCEE7; --v-sky:#DCE7FA }
:root[data-theme="summer"]   { --base:#DEF8FB; --surf:#C7F2F7; --band:#AEEBF2; --band2:#95E4EE; --rule:#9FDDE6; --ink:#264D52; --sub:#48686C; --accent:#036E7F; --faint:#6C8487; --deco:#088594; --v-rose:#FBE0EC; --v-sky:#AEEBF2 }
:root[data-theme="autumn"]   { --base:#FFEFE5; --surf:#FFE2D0; --band:#FED4B9; --band2:#FDC6A2; --rule:#F5C6AA; --ink:#583F2D; --sub:#735C4D; --accent:#905200; --faint:#8B796E; --deco:#B26101; --v-rose:#FED4B9; --v-sky:#E0E9F6 }
:root[data-theme="halloween"]{ --base:#F4F0FE; --surf:#ECE3FF; --band:#E3D6FE; --band2:#D9C7FD; --rule:#D7C7F2; --ink:#49405A; --sub:#655D75; --accent:#8739BD; --faint:#807A8C; --deco:#9556D5; --v-rose:#F7DCC6; --v-sky:#E3D6FE }
:root[data-theme="christmas"]{ --base:#E6F8E9; --surf:#D5F1D9; --band:#C2EAC9; --band2:#AFE3B8; --rule:#B2DCBA; --ink:#334C38; --sub:#536857; --accent:#057146; --faint:#738476; --deco:#058B4C; --v-rose:#FBDCDC; --v-sky:#C2EAC9 }
:root[data-theme="newyear"]  { --base:#F8F3DE; --surf:#F1E9C8; --band:#EBDEB0; --band2:#E4D399; --rule:#DDD0A4; --ink:#4C4528; --sub:#686249; --accent:#6B6203; --faint:#827D6B; --deco:#877604; --v-rose:#F6DCD2; --v-sky:#EBDEB0 }
:root[data-theme="snow"]     { --base:#E9F4FE; --surf:#D6ECFE; --band:#C2E2FF; --band2:#AED8FF; --rule:#B4D6F4; --ink:#30485C; --sub:#506476; --accent:#0063B7; --faint:#707F8D; --deco:#047BCE; --v-rose:#F2E2EE; --v-sky:#C2E2FF }
:root[data-theme="rain"]     { --base:#ECF3FF; --surf:#DCE9FF; --band:#CCDFFF; --band2:#BCD4FF; --rule:#BDD3F6; --ink:#37465D; --sub:#556378; --accent:#3654D5; --faint:#747E8E; --deco:#3C6FE7; --v-rose:#EDE2F4; --v-sky:#CCDFFF }
:root[data-theme="night"]    { --base:#F2F1FE; --surf:#E8E5FE; --band:#DDD9FF; --band2:#D2CDFF; --rule:#CFCAF2; --ink:#46425D; --sub:#615E76; --accent:#7940C8; --faint:#7D7B8D; --deco:#855DDF; --v-rose:#F0DEEE; --v-sky:#DDD9FF }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--base); color:var(--ink);
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  font-weight:400; font-size:var(--s3); line-height:1.8; letter-spacing:.02em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
/* Nunito の数字は既定で等幅。font-variant-numeric は不要 */
.mono{font-family:'Nunito','Helvetica Neue',sans-serif;font-weight:400}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--r1)}

/* ===== にじみ ― ページ全体に1枚。セクションで切らないので段差が出ない ===== */
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.34;will-change:transform}
.b1{width:78vw;height:78vw;left:-22vw;top:-18vw;
    background:radial-gradient(closest-side,var(--v-rose),transparent 100%);
    animation:d1 44s ease-in-out infinite alternate}
.b2{width:64vw;height:64vw;right:-16vw;top:6vh;
    background:radial-gradient(closest-side,var(--v-sky),transparent 100%);
    animation:d2 52s ease-in-out infinite alternate}
.b3{width:56vw;height:56vw;left:8vw;bottom:-14vw;
    background:radial-gradient(closest-side,var(--v-rose),transparent 100%);
    animation:d3 60s ease-in-out infinite alternate}
.b4{width:46vw;height:46vw;right:4vw;bottom:-8vw;
    background:radial-gradient(closest-side,var(--v-sky),transparent 100%);
    animation:d1 56s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate3d(6vw,4vh,0) scale(1.12)}}
@keyframes d2{to{transform:translate3d(-5vw,6vh,0) scale(1.08)}}
@keyframes d3{to{transform:translate3d(4vw,-5vh,0) scale(1.14)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

/* width:100% が要。これが無いと flex の中で縮んでヒーローだけ列がずれる */
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 var(--x5);position:relative;z-index:3}
section{position:relative}
.sec{padding:var(--x6) 0}          /* 上下対称。中身が変わっても間隔が動かない */
.label{font-size:var(--s1);font-weight:500;letter-spacing:.02em;color:var(--sub);margin-bottom:var(--x4)}
.label .en{font-family:'Nunito',sans-serif;font-weight:600;letter-spacing:.22em;color:var(--accent);margin-right:var(--x2)}
.rise{opacity:0;transform:translateY(12px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.rise.in{opacity:1;transform:none}

/* hero */
.hero{min-height:100svh;display:flex;align-items:center;overflow:hidden}
.figbed{position:absolute;bottom:0;z-index:1;pointer-events:none;
  width:min(46vw,620px);height:74svh;border-radius:50% 50% 0 0/62% 62% 0 0;filter:blur(24px);
  background:radial-gradient(60% 70% at 50% 62%,var(--band2),var(--band) 62%,transparent 100%);
  right:max(var(--x5),calc((100vw - 1080px)/2 + var(--x5) - 60px))}
.fig{position:absolute;bottom:0;height:88svh;width:auto;z-index:2;filter:drop-shadow(0 10px 26px rgba(89,60,74,.14));pointer-events:none;
  right:max(var(--x5),calc((100vw - 1080px)/2 + var(--x5)))}   /* 右端をコンテンツ枠に揃える */
.fig.framed{bottom:auto;top:50%;transform:translateY(-50%);height:auto;width:min(44vw,520px)}
.sup{font-size:var(--s1);letter-spacing:.22em;color:var(--sub);margin-bottom:var(--x2)}
.big{font-size:var(--sd);line-height:1;letter-spacing:.01em;display:block;font-weight:500;
  color:var(--deco);text-shadow:0 3px 28px rgba(203,60,131,.18)}
.greet{margin-top:var(--x3);font-size:var(--s3);letter-spacing:.03em;max-width:22em}
/* 状態は面に載せる。立ち絵を薄くして可読性を作らない */
.status{margin-top:var(--x5);display:inline-block;background:var(--band);border-radius:var(--r3);padding:var(--x3) var(--x4);backdrop-filter:blur(8px)}
.stRow{display:flex;align-items:center;gap:var(--x2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--faint)}
.status.on .dot{background:var(--accent);box-shadow:0 0 0 8px rgba(184,20,103,.16);animation:breathe 3.6s ease-in-out infinite}
.stMain{font-size:var(--s3);font-weight:500}
.stSub{margin-top:var(--x1);margin-left:26px;font-size:var(--s2);color:var(--sub)}
.stSub b{font-weight:500;color:var(--ink)}
.link{display:inline-block;min-height:44px;line-height:44px;font-size:var(--s2);font-weight:500;
  color:var(--accent);box-shadow:inset 0 -2px 0 rgba(184,20,103,.34)}
.stGo{margin-left:26px}

/* today ─ 巨大数字は装飾。読める日付を別に置く */
.card{position:relative;background:var(--surf);box-shadow:inset 0 0 0 1px var(--rule);border-radius:var(--r3);
  padding:var(--x5);overflow:hidden}
.bigdate{position:absolute;right:var(--x4);top:var(--x2);font-size:var(--sd);
  line-height:1;color:var(--deco);opacity:.5;pointer-events:none;user-select:none}
.dateline{font-size:var(--s1);letter-spacing:.14em;color:var(--sub);margin-bottom:var(--x2)}
.msg{font-size:var(--s4);line-height:1.7;letter-spacing:.03em;max-width:20em}
.tdBody{margin-top:var(--x3);font-size:var(--s2);color:var(--sub)}

/* 時刻の尺 ─ 予定が無い日は出さない */
.scaleWrap{margin-bottom:var(--x5)}
.scale{position:relative;height:14px;border-radius:7px;background:var(--surf);
  box-shadow:inset 0 0 0 1px var(--rule)}
.scale .tick{position:absolute;top:50%;width:3px;height:3px;border-radius:50%;
  background:var(--faint);transform:translate(-50%,-50%)}
.scale .band{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--accent);opacity:.24}
.scale .thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
  background:var(--accent);transform:translate(-50%,-50%);
  box-shadow:0 0 0 6px rgba(160,63,104,.14);transition:left .3s cubic-bezier(.2,.7,.3,1)}
.scaleTicks{position:relative;height:20px;margin-top:var(--x1);font-size:var(--s1);color:var(--sub)}
.scaleTicks span{position:absolute;transform:translateX(-50%)}

/* schedule */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--x1);margin-bottom:var(--x5)}
.day{padding:var(--x3) var(--x1);text-align:center;border-radius:var(--r2);background:var(--surf);box-shadow:inset 0 0 0 1px var(--rule)}
.day.today{background:var(--band)}
.dName{font-size:var(--s1);font-weight:500;color:var(--sub);margin-bottom:var(--x2)}
.day.today .dName{color:var(--accent)}
.dTime{font-size:var(--s3);font-weight:500}
.dLabel{font-size:var(--s1);color:var(--sub);margin-top:var(--x1);line-height:1.7}
.dNone{font-size:var(--s2);color:var(--sub)}
.upList li{display:grid;grid-template-columns:200px 1fr;gap:0 var(--x4);align-items:baseline;
  background:var(--surf);box-shadow:inset 0 0 0 1px var(--rule);border-radius:var(--r2);padding:var(--x3) var(--x4);margin-bottom:var(--x1)}
.upDate{font-size:var(--s2);color:var(--sub);white-space:nowrap}
.upTitle{font-size:var(--s3);font-weight:500}
.upTitle a:hover{color:var(--accent)}
.note{margin-top:var(--x3);font-size:var(--s2);color:var(--sub)}
.empty{font-size:var(--s2);color:var(--sub)}

/* about */
.firstGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--x5)}
.vid{aspect-ratio:16/9;position:relative;background:var(--v-sky);border-radius:var(--r3);overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.firstTx p{font-size:var(--s2);color:var(--sub);max-width:22em}

/* おたより ─ フォームの右に「従」を1体。足をフォームの下端に着ける */
.msgRow{display:grid;grid-template-columns:600px 1fr;gap:0 var(--x5);align-items:end}
.msgArt{width:224px;height:auto;display:block;justify-self:start;pointer-events:none}
.form{max-width:600px}
.form .hint{font-size:var(--s2);color:var(--sub);margin-bottom:var(--x4)}
.form label{display:block;font-size:var(--s1);font-weight:500;color:var(--sub);margin-bottom:var(--x1)}
.form input,.form textarea{
  width:100%;min-height:48px;background:#fff;border:1px solid var(--faint);border-radius:var(--r2);
  padding:14px var(--x3);margin-bottom:var(--x3);
  font-family:inherit;font-weight:400;font-size:var(--s3);letter-spacing:.03em;line-height:1.9;color:var(--ink);
  outline:none;transition:border-color .3s}
.form textarea{min-height:120px;resize:vertical}
.form input:focus,.form textarea:focus{border-color:var(--accent)}
.send{min-height:48px;border:0;border-radius:var(--r2);background:var(--accent);color:#fff;
  padding:0 var(--x4);font-family:inherit;font-weight:500;font-size:var(--s2);letter-spacing:.06em;
  cursor:pointer;transition:opacity .3s}
.send:hover{opacity:.86}
.send:disabled{opacity:.4;cursor:default}
.sent{margin-top:var(--x3);font-size:var(--s2);color:var(--accent);min-height:24px}

/* links */
.ul{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--x2)}
.ul a{display:block;background:var(--surf);box-shadow:inset 0 0 0 1px var(--rule);border-radius:var(--r2);padding:var(--x3) var(--x4);min-height:88px}
.ul a:hover{background:var(--v-rose)}
.ul .en{font-family:'Nunito',sans-serif;font-weight:600;font-size:var(--s1);letter-spacing:.16em;
  color:var(--accent);display:block;margin-bottom:var(--x1)}
.ul .jp{font-size:var(--s3);font-weight:500}

/* footer ─ ちび絵はここで地面に足を着ける */
footer .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--x4);
  padding-top:var(--x5);padding-bottom:var(--x4)}
.foot{font-size:var(--s1);letter-spacing:.22em;color:var(--sub)}
.chibi{width:112px;height:auto;display:block}

@media(max-width:820px){
  :root{--sd:clamp(72px,20vw,120px)}
  .wrap{padding:0 var(--x3)}
  .sec{padding:var(--x5) 0}
  /* 立ち絵と文字を縦に分ける。文字は上、立ち絵は下端に立たせる */
  .hero{align-items:flex-start;padding:var(--x6) 0 0}
  .fig{height:min(58svh,490px);right:calc(var(--x2) * -1);opacity:1;z-index:1}
  /* 正月テーマ：文字の背後に敷かない。下端に寄せる */
  .fig.framed{width:min(72vw,300px);right:calc(var(--x2) * -1);
    top:auto;bottom:0;transform:none;opacity:1;z-index:1}
  /* 立ち絵と重なる唯一の面。ここだけ不透明にする（--veil は絵の上では計算できない） */
  .status{background:#FFFFFF;box-shadow:0 2px 24px rgba(52,47,58,.06)}
  .msgRow{grid-template-columns:1fr}
  .msgArt{display:none}
  .card{padding:var(--x4) var(--x3)}
  .bigdate{right:var(--x2);top:var(--x1);opacity:.36}
  .msg{max-width:none}
  .week{gap:4px}
  .day{padding:var(--x2) 2px;border-radius:var(--r1)}
  .dName{font-size:12px;margin-bottom:var(--x1)}
  .dTime{font-size:var(--s1)}
  .dLabel{display:none}
  .upList li{grid-template-columns:1fr;gap:var(--x1);padding:var(--x3)}
  .firstGrid{grid-template-columns:1fr;gap:var(--x4)}
  .ul{grid-template-columns:repeat(2,1fr)}
  .ul a{min-height:76px;padding:var(--x3)}
  .chibi{width:88px}
}
</style>
</head>
<body>

<div class="aura" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="blob b3"></div><div class="blob b4"></div>
</div>

<section class="hero">
  <div class="figbed" aria-hidden="true"></div>
  <img class="fig" src="img/hero.webp" alt="" id="fig" width="488" height="1300" fetchpriority="high" decoding="async">
  <div class="wrap">
    <div class="mark rise">
      <p class="sup mono" id="sup">TENPON / YOUTUBE</p>
      <span class="big mono" id="nameEn">ten</span>
      <p class="greet" id="greeting"></p>
      <div class="status off" id="status">
        <div class="stRow"><span class="dot"></span><span class="stMain" id="stMain">確認しています…</span></div>
        <p class="stSub" id="stSub"></p>
        <a class="link stGo" id="stGo" style="display:none" target="_blank" rel="noopener">配信を見に行く</a>
      </div>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap rise">
    <div class="card">
      <span class="bigdate mono" id="bigDay" aria-hidden="true"></span>
      <p class="label"><span class="en">TODAY</span>おしらせ</p>
      <p class="dateline mono" id="dateLine"></p>
      <p class="msg" id="tdMsg"></p>
      <p class="tdBody" id="tdBody" style="display:none"></p>
      <a class="link" id="tdLink" style="display:none" target="_blank" rel="noopener"></a>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <p class="label rise"><span class="en">SCHEDULE</span>配信スケジュール</p>
    <div class="scaleWrap rise" id="scaleWrap" style="display:none">
      <div class="scale" id="scale"><span class="thumb" id="nowmark" style="left:0"></span></div>
      <div class="scaleTicks mono" id="scaleTicks"></div>
    </div>
    <div class="week rise" id="week"></div>
    <p class="label rise"><span class="en">UPCOMING</span>これからの配信</p>
    <ul class="upList rise" id="upcoming"></ul>
    <p class="note rise" id="schedNote" style="display:none"></p>
  </div>
</section>

<section class="sec" id="aboutSec" style="display:none">
  <div class="wrap">
    <p class="label rise"><span class="en">ABOUT</span>てんについて</p>
    <div class="firstGrid rise">
      <div class="vid" id="vid" style="display:none"></div>
      <div class="firstTx"><p id="about"></p></div>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <p class="label rise"><span class="en">MESSAGE</span>おたより</p>
    <div class="msgRow rise">
    <div class="form">
      <p class="hint">感想でも、質問でも。<br>届いたものは、このページの管理者が預かります。<br>てんに渡すかどうかは、てんが決めます。</p>
      <label for="mName">なまえ ／ なくても大丈夫</label>
      <input id="mName" maxlength="40" autocomplete="off">
      <label for="mBody">ないよう</label>
      <textarea id="mBody" maxlength="1000"></textarea>
      <button class="send" id="mSend">おくる</button>
      <p class="sent" id="mSent"></p>
    </div>
    <img class="msgArt" src="img/chibi_white.webp" alt=""
         width="448" height="681" loading="lazy" decoding="async">
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap rise">
    <p class="label"><span class="en">LINKS</span></p>
    <ul class="ul" id="links"></ul>
  </div>
</section>

<footer>
  <div class="wrap">
    <p class="foot mono">TENPON</p>
    <img class="chibi" src="img/chibi_frill.webp" alt="" width="224" height="449" loading="lazy" decoding="async">
  </div>
</footer>

<script>
(function(){
  "use strict";
  var CH_START = 2023;
  var PROJ = 'hexa-relation';
  var KEY  = 'AIzaSyDlovNerE44bGykzWDJkqmoD4fbSHnzveI';
  var FS   = 'https://firestore.googleapis.com/v1/projects/'+PROJ+'/databases/(default)/documents/';
  var J = function(p){ return fetch(p+'?t='+Date.now()).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); };

  var now = new Date();
  var MM = ('0'+(now.getMonth()+1)).slice(-2), DD = ('0'+now.getDate()).slice(-2);
  var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var WD  = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var WDJ = ['日','月','火','水','木','金','土'];

  // 巨大数字は装飾（aria-hidden）。読める日付は別に置く
  document.getElementById('bigDay').textContent = String(now.getDate());
  document.getElementById('dateLine').textContent =
    now.getFullYear()+'.'+MM+'.'+DD+'  '+WD[now.getDay()];

  function inRange(a,b){
    var t=MM+DD, s=a.slice(-5).replace('-',''), e=b.slice(-5).replace('-','');
    return s<=e ? (t>=s&&t<=e) : (t>=s||t<=e);
  }
  function match(when){
    if (when.indexOf('..')>-1){
      var p=when.split('..');
      if (p[0].length===10&&p[1].length===10){
        var td=now.getFullYear()+'-'+MM+'-'+DD;
        return td>=p[0]&&td<=p[1];
      }
      return inRange(p[0],p[1]);
    }
    if (when.length===10) return when===(now.getFullYear()+'-'+MM+'-'+DD);
    return when===MM+'-'+DD;
  }

  var board = fetch(FS+'ten_board/current').then(function(r){ return r.ok?r.json():null; })
    .then(function(d){ try{ return JSON.parse(d.fields.data.stringValue); }catch(e){ return null; } })
    .catch(function(){ return null; });

  Promise.all([ J('profile.json'), J('events.json'), J('schedule.json'), J('/save/ten/live_status.json'), board ])
  .then(function(res){
    var prof=res[0]||{}, ev=res[1]||{}, sc=res[2]||{}, live=res[3]||{}, bd=res[4];
    if (bd){
      if (bd.message) ev.message = bd.message;
      if (bd.schedule && bd.schedule.weekly) sc = bd.schedule;
    }

    if (prof.nameEn) document.getElementById('nameEn').textContent = prof.nameEn;
    if (prof.handle) document.getElementById('sup').textContent = prof.handle+' / YOUTUBE';
    if (prof.greeting) document.getElementById('greeting').textContent = prof.greeting;

    // 本人の言葉が無いものは、代筆せずに節ごと出さない
    var hasAbout = !!(prof.about && prof.about.length);
    var hasVideo = !!(prof.firstVideo && prof.firstVideo.id);
    if (hasAbout) document.getElementById('about').innerHTML = prof.about.join('<br>');
    if (hasVideo){
      var v=document.getElementById('vid'); v.style.display='';
      v.innerHTML='<iframe src="https://www.youtube.com/embed/'+prof.firstVideo.id+'" title="" allowfullscreen loading="lazy"></iframe>';
    }
    if (hasAbout || hasVideo){
      document.getElementById('aboutSec').style.display='';
      if (!hasVideo || !hasAbout) document.querySelector('#aboutSec .firstGrid').style.gridTemplateColumns='1fr';
    }
    if (prof.links) document.getElementById('links').innerHTML = prof.links.map(function(l){
      return '<li><a href="'+l.url+'" target="_blank" rel="noopener"><span class="en mono">'+l.en+'</span><span class="jp">'+l.jp+'</span></a></li>';
    }).join('');

    var list=ev.events||[], notice=null, season=null;
    for (var i=0;i<list.length;i++){
      if (!match(list[i].when)) continue;
      if (list[i].kind==='notice' && !notice) notice=list[i];
      if (list[i].kind==='season' && !season) season=list[i];
    }
    var pick = notice ? notice
      : (ev.message && ev.message.text) ? { title:ev.message.text, body:'', link:null }
      : season ? season : (ev.default||{title:'',body:''});

    if (pick.theme) document.documentElement.setAttribute('data-theme', pick.theme);
    document.getElementById('tdMsg').innerHTML =
      (pick.title||'').replace('{years}', String(now.getFullYear()-CH_START)).replace(/\n/g,'<br>');
    if (pick.body){ var b=document.getElementById('tdBody'); b.textContent=pick.body; b.style.display=''; }
    if (pick.link && pick.link.url){
      var a=document.getElementById('tdLink'); a.textContent=pick.link.label||'くわしく'; a.href=pick.link.url; a.style.display='';
    }
    // 立ち絵の差し替え。ヒーローには常に1体しか出ないので、
    // 瞳の色が違う絵（box）もここからなら同じ画面に並ばない
    var ART={ kimono:'img/kimono.webp', box:'img/box.webp' };
    if (ART[pick.art]){
      var f=document.getElementById('fig');
      f.src=ART[pick.art]; f.classList.add('framed');
    }

    var weekly=sc.weekly||[], hasWeekly=false, html='';
    for (var d=0; d<7; d++){
      var w=null;
      for (var k=0;k<weekly.length;k++) if (weekly[k].day===d) w=weekly[k];
      var on=!!(w&&w.time); if(on) hasWeekly=true;
      html += '<div class="day'+(on?' has':'')+(d===now.getDay()?' today':'')+'">'
           +  '<p class="dName">'+WDJ[d]+'</p>'
           +  (on ? '<p class="dTime mono">'+w.time+'</p>'+(w.label?'<p class="dLabel">'+w.label+'</p>':'') : '<p class="dNone">—</p>')
           +  '</div>';
    }
    document.getElementById('week').innerHTML = html;

    var up=(sc.upcoming||[]).filter(function(u){ return !u.date || u.date >= (now.getFullYear()+'-'+MM+'-'+DD); })
      .sort(function(a,b){ return a.date<b.date?-1:1; }).slice(0,5);
    var ul=document.getElementById('upcoming');
    if (up.length){
      ul.innerHTML = up.map(function(u){
        var dt=new Date(u.date+'T00:00:00');
        var head=(dt.getMonth()+1)+'月'+dt.getDate()+'日（'+WDJ[dt.getDay()]+'）'+(u.time?'　'+u.time:'');
        var t=u.url?'<a href="'+u.url+'" target="_blank" rel="noopener">'+(u.title||'配信')+'</a>':(u.title||'配信');
        return '<li><p class="upDate mono">'+head+'</p><p class="upTitle">'+t+'</p></li>';
      }).join('');
    } else {
      ul.innerHTML = '<li style="grid-template-columns:1fr"><p class="empty">'
        + (hasWeekly?'今のところ、予定に入っている配信はありません。':'ここはまだ準備中です。')
        + '<br><a class="link" href="https://www.youtube.com/@TENpon_ch/streams" target="_blank" rel="noopener">'
        + 'YouTubeで配信予定を見る</a></p></li>';
    }
    if (sc.note){ var n=document.getElementById('schedNote'); n.textContent=sc.note; n.style.display=''; }

    // 時刻の尺（0〜24時）。予定が1件も無い日は尺ごと出さない
    (function(){
      var todayW=null;
      for (var i=0;i<weekly.length;i++) if (weekly[i].day===now.getDay() && weekly[i].time) todayW=weekly[i];
      var todayUp=(sc.upcoming||[]).filter(function(u){ return u.date===(now.getFullYear()+'-'+MM+'-'+DD) && u.time; });
      if (!todayW && !todayUp.length) return;

      document.getElementById('scaleWrap').style.display='';
      var scale=document.getElementById('scale');
      for (var t=0;t<=24;t+=3){                       // 3時間ごとに点
        var d=document.createElement('span'); d.className='tick';
        d.style.left=(t/24*100).toFixed(3)+'%'; scale.appendChild(d);
      }
      document.getElementById('scaleTicks').innerHTML =
        [6,12,18].map(function(h){ return '<span style="left:'+(h/24*100)+'%">'+h+'</span>'; }).join('');

      function band(time){
        var hm=String(time).split(':'), a=(+hm[0]*60+(+hm[1]||0))/1440*100;
        var b=document.createElement('span'); b.className='band';
        b.style.left=a.toFixed(3)+'%'; b.style.width=(120/1440*100).toFixed(3)+'%';
        scale.appendChild(b);
      }
      if (todayW) band(todayW.time);
      todayUp.forEach(function(u){ band(u.time); });

      var mark=document.getElementById('nowmark');
      function place(){
        var n=new Date();
        mark.style.left=((n.getHours()*60+n.getMinutes())/1440*100).toFixed(3)+'%';
      }
      place(); setInterval(place,60000);
    })();

    var st=document.getElementById('status'), main=document.getElementById('stMain'),
        sub=document.getElementById('stSub'), go=document.getElementById('stGo');
    if (live && live.isLive){
      st.className='status on'; main.textContent='いま、配信中です'; sub.textContent='';
      go.href = live.videoId ? 'https://www.youtube.com/watch?v='+live.videoId : 'https://www.youtube.com/@TENpon_ch/live';
      go.style.display='';
    } else {
      st.className='status off'; main.textContent='いまは、おやすみ中';
      if (up.length){
        var d0=new Date(up[0].date+'T00:00:00');
        sub.innerHTML='つぎは <b>'+(d0.getMonth()+1)+'月'+d0.getDate()+'日（'+WDJ[d0.getDay()]+'）'+(up[0].time?' '+up[0].time:'')+'</b> から';
      }
    }
  });

  /* ---- おたより送信 ---- */
  var btn=document.getElementById('mSend'), out=document.getElementById('mSent');
  btn.addEventListener('click', function(){
    var body=(document.getElementById('mBody').value||'').trim();
    if (!body){ out.textContent='ないようを書いてください。'; return; }
    btn.disabled=true; out.textContent='おくっています…';
    fetch(FS+'ten_inbox?key='+KEY, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fields:{
        name:      { stringValue:(document.getElementById('mName').value||'').trim().slice(0,40) },
        body:      { stringValue: body.slice(0,1000) },
        createdAt: { stringValue: new Date().toISOString() },
        read:      { booleanValue: false }
      }})
    }).then(function(r){
      if (!r.ok) throw 0;
      out.textContent='おくりました。ありがとうございます。';
      document.getElementById('mName').value=''; document.getElementById('mBody').value='';
    }).catch(function(){
      out.textContent='おくれませんでした。時間をおいてもう一度お願いします。';
      btn.disabled=false;
    });
  });

  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{ rootMargin:'0px 0px -10% 0px' });
  document.querySelectorAll('.rise').forEach(function(el,i){ el.style.transitionDelay=(i%4)*90+'ms'; io.observe(el); });
})();
</script>
</body>
</html>
