<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexa Relation | ぼうけんの じゅんび</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --accent: #7a2fbf;
            --accent-deep: #3d1a63;
            --gold: #ffcc4d;
            --blue: #1e40af;
            --brown: #8b5e3c;
            --bg-color: #000;
            --window-bg: #0a0a0a;
            --border-color: #3d3226;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(ellipse at 50% 20%, rgba(122,47,191,0.20), transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(139,94,60,0.18), transparent 60%);
            color: #fff;
            font-family: 'DotGothic16', sans-serif;
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .px { font-family: 'Press Start 2P', 'DotGothic16', sans-serif; }

        .back-link-fixed {
            position: fixed; top: 4%; left: 4%; z-index: 20;
            color: rgba(255,255,255,0.65); font-size: 0.55rem;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 10px; text-decoration: none;
        }
        .back-link-fixed:hover { color: var(--gold); border-color: var(--gold); }

        .mother-window {
            background-color: var(--window-bg);
            border-top: 4px solid var(--accent);
            box-shadow: inset 0 0 0 2px #fff, 0 10px 30px rgba(0,0,0,0.6);
            padding: 4px;
            width: 100%;
            max-width: 500px;
        }

        .mother-window-inner {
            padding: 2.2rem 1.8rem;
        }

        h1 {
            font-size: 1rem; margin: 0 0 1.6rem; letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border-color); padding-bottom: 0.8rem;
            text-align: center; color: var(--gold);
        }

        .input-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.6rem; font-size: 0.75rem; color: var(--gold); }

        input, textarea {
            width: 100%;
            background: #000;
            border: 2px solid var(--border-color);
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s;
        }
        input::placeholder, textarea::placeholder { color: #555; }
        input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,64,175,0.25); }

        .submit-btn {
            width: 100%;
            font-family: 'Press Start 2P', monospace;
            background: var(--gold);
            border: 3px solid #fff;
            box-shadow: 4px 4px 0 var(--accent-deep);
            color: #000;
            padding: 14px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 0.5rem;
            letter-spacing: 0.05em;
        }
        .submit-btn:active { box-shadow: 1px 1px 0 var(--accent-deep); transform: translate(3px, 3px); }

        .back-link { display: block; text-align: center; margin-top: 1.6rem; color: #666; text-decoration: none; font-size: 0.75rem; }
        .back-link:hover { color: var(--gold); }

        .hidden { display: none; }

        #success-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; text-align: center;
        }
        #success-overlay .mother-window-inner p { color: #fff; font-size: 0.85rem; line-height: 2.2; }
    </style>
</head>
<body>
    <a href="../" class="back-link-fixed">◀ もどる</a>

    <div class="mother-window">
        <div class="mother-window-inner">
            <h1 class="px">▼ ぼうけんの じゅんび</h1>

            <p id="guidance-text" style="font-size: 0.7rem; line-height: 1.9; letter-spacing: 0.02em; margin-bottom: 1.6rem; color: #999; text-align: center;"></p>

            <form id="order-form">
                <div class="input-group">
                    <label>▶ おなまえ (2文字以上)</label>
                    <input type="text" id="name" name="name" placeholder="おなまえ を いれてください" minlength="2" required>
                </div>

                <div class="input-group">
                    <label>▶ れんらくさき</label>
                    <input type="text" id="contact" name="contact" placeholder="メール / SNS ID など" required>
                </div>

                <div class="input-group">
                    <label>▶ ごいらい内容</label>
                    <textarea id="message" name="message" rows="5" placeholder="どんな ぼうけん（ごいらい）を したいですか？" required></textarea>
                </div>

                <input type="hidden" id="referrer" name="referrer">

                <button type="submit" class="submit-btn">▶ きろくを おくる</button>
            </form>

            <a href="javascript:history.back()" class="back-link">▶ もどる</a>
        </div>
    </div>

    <div id="success-overlay">
        <div class="mother-window" style="max-width: 350px;">
            <div class="mother-window-inner">
                <p>きろくが 完了しました！<br><br>のちほど 伝書鳩（通知）が<br>とどきます。 おたのしみに！</p>
                <button onclick="window.location.href='../'" class="submit-btn">▶ TOPへ もどる</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDlovNerE44bGykzWDJkqmoD4fbSHnzveI",
          authDomain: "hexa-relation.firebaseapp.com",
          projectId: "hexa-relation",
          storageBucket: "hexa-relation.firebasestorage.app",
          messagingSenderId: "318065017750",
          appId: "1:318065017750:web:94acf3c9c43632b3ff93b7",
          measurementId: "G-15NM9TWFE2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref') || urlParams.get('from') || 'ちょくせつ';
        document.getElementById('referrer').value = ref;

        // Dynamic Guidance message
        const guidanceEl = document.getElementById('guidance-text');
        if (ref === 'hexa_archive' || ref === 'hexa_card') {
            guidanceEl.innerHTML = "デジタル名刺「Hexa Card」に関するご質問、またはシステム連携・LP開発などのご依頼窓口です。<br>ご相談内容を下記よりお気軽にお書き込みください。";
        } else {
            guidanceEl.innerHTML = "Hexa Relationへのご依頼・お問い合わせ窓口です。<br>システム開発、制作のご相談など、何でもお気軽に下記よりお尋ねください。";
        }

        const form = document.getElementById('order-form');
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1507236311180771348/P-wdDn_xEgm7ig5w7s3WHuP3waVmARS1sNi9lkvsmzMuDnUm8S2lKrx6Dv7ieQmtTFO1';
        let isSubmitting = false;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSubmitting) return;
            isSubmitting = true;

            const name = document.getElementById('name').value;
            const contact = document.getElementById('contact').value;
            const message = document.getElementById('message').value;
            const referrer = document.getElementById('referrer').value;

            try {
                await db.collection('orders').add({
                    name: name,
                    contact: contact,
                    message: message,
                    referrer: referrer,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                console.warn("Firestore Error:", err);
            }

            const discordMessage = {
                embeds: [{
                    title: "🎮 【新着】ぼうけんの ごいらい！",
                    color: 3447003, // Slate Blue
                    fields: [
                        { name: "👤 おなまえ", value: name, inline: true },
                        { name: "📱 れんらくさき", value: contact, inline: true },
                        { name: "📜 ごいらい内容", value: "```" + message + "```" },
                        { name: "🚩 紹介元", value: `**${referrer}**`, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(discordMessage)
                });

                if (response.ok) {
                    document.getElementById('success-overlay').style.display = 'flex';
                    playSuccessSound();
                } else {
                    alert('エラーが おきました。');
                    isSubmitting = false;
                }
            } catch (err) {
                console.error(err);
                alert('つうしん エラーが おきました。');
                isSubmitting = false;
            }
        });

        function playSuccessSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); // C6
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }
    </script>
</body>
</html>
