<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexa Relation | ゲームの世界を、現実の武器に。</title>
    <meta name="description" content="Hexa Relation（ヘキサ・リレーション）は、次世代デジタル名刺「Hexa Card」と、没入型ゲーム風ポートフォリオ・LP制作という2つの事業を展開する制作スタジオです。">
    <meta name="keywords" content="Hexa Card, 電子名刺, デジタル名刺, ポートフォリオ 制作, ゲーム風 サイト, LP制作 依頼, VTuber LP, オーダーメイド Web制作">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hexa-relation.com/">
    <meta property="og:title" content="Hexa Relation | ゲームの世界を、現実の武器に。">
    <meta property="og:description" content="次世代デジタル名刺「Hexa Card」と、没入型ゲーム風ポートフォリオ・LP制作。2つの事業で、あなたの存在を強く印象づけます。">
    <meta property="og:image" content="https://hexa-relation.com/enhanced_E3FD57_1_102_o.png">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Hexa Relation",
      "url": "https://hexa-relation.com/",
      "description": "次世代デジタル名刺「Hexa Card」と、没入型ゲーム風ポートフォリオ・LP制作を展開する制作スタジオ。",
      "makesOffer": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Product",
            "name": "Hexa Card",
            "offers": {
              "@type": "Offer",
              "price": "3000",
              "priceCurrency": "JPY",
              "availability": "https://schema.org/InStock",
              "url": "https://virtual-business-card.hexa-relation.com/purchase"
            }
          }
        },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Game-Style Portfolio / LP Production" } }
      ]
    }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Press Start 2P', monospace;
            background: #000;
        }

        .screen {
            display: none;
            position: relative;
            width: 100%; height: 100vh; min-height: 480px;
            overflow: hidden;
        }
        .screen.active { display: flex; }

        /* ===== Screen 1: Title / Ready ===== */
        #screen-title {
            flex-direction: column; align-items: center; justify-content: center;
            background: #000; text-align: center; padding: 24px;
            gap: clamp(14px, 3vh, 26px);
        }
        .brand-row {
            display: flex; align-items: center; justify-content: center; gap: 16px;
        }
        .brand-logo {
            width: clamp(40px, 8vw, 56px); height: auto;
            filter: drop-shadow(0 2px 8px rgba(122,47,191,0.35));
        }
        .game-title {
            color: #fff; font-size: clamp(1.1rem, 5vw, 2rem); margin: 0;
            letter-spacing: 0.08em; text-shadow: 3px 3px 0 #3d1a63;
        }
        .game-sub { color: #ffcc4d; font-size: clamp(0.5rem, 2vw, 0.65rem); margin: 0; }

        .status-row {
            display: flex; gap: clamp(16px, 5vw, 40px); align-items: center; justify-content: center;
            color: #fff; font-size: clamp(0.55rem, 2vw, 0.75rem);
        }
        .status-item { display: flex; flex-direction: column; align-items: center; gap: 6px; line-height: 1.8; }
        .mini-avatar {
            width: 34px; height: 34px; object-fit: cover; object-position: top center;
            border: 2px solid #fff; image-rendering: pixelated; background: #000;
        }

        .start-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.7rem, 2.4vw, 0.9rem);
            color: #000; background: #ffcc4d;
            border: 4px solid #fff; box-shadow: 4px 4px 0 #3d1a63;
            padding: 14px 38px; cursor: pointer; letter-spacing: 0.1em;
        }
        .start-btn:active { box-shadow: 1px 1px 0 #3d1a63; transform: translate(3px, 3px); }
        .press-hint { color: #888; font-size: clamp(0.45rem, 1.6vw, 0.55rem); margin: 0; animation: blink 1.1s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* ===== Screen 2: Dungeon Menu ===== */
        #screen-dungeon { flex-direction: column; }

        .dungeon-bg {
            position: relative; flex: 1; min-height: 0;
            background:
                radial-gradient(ellipse at 50% 40%, rgba(90,60,30,0.28), transparent 65%),
                repeating-linear-gradient(0deg, #2c221b 0 40px, #241c17 40px 42px),
                repeating-linear-gradient(90deg, #2c221b 0 40px, #241c17 40px 42px);
            border: 10px solid #000;
            box-shadow: inset 0 0 0 6px #4a3524, inset 0 0 60px rgba(0,0,0,0.65);
        }
        .torch {
            position: absolute; top: 5%; width: 14px; height: 26px;
            background: #3a2a1a; border: 2px solid #000; z-index: 4;
        }
        .torch::after {
            content: ''; position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 20px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: radial-gradient(circle, #ffdd66 0%, #ff8c1a 55%, transparent 75%);
            filter: blur(1px);
            animation: flicker 0.9s ease-in-out infinite alternate;
        }
        .torch::before {
            content: ''; position: absolute; top: -70px; left: 50%; transform: translateX(-50%);
            width: 110px; height: 110px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,180,60,0.22), transparent 70%);
            animation: flicker 0.9s ease-in-out infinite alternate-reverse;
        }
        @keyframes flicker { from { opacity: 0.75; transform: translateX(-50%) scale(0.94); } to { opacity: 1; transform: translateX(-50%) scale(1.05); } }

        .wall-crest {
            position: absolute; top: 11%; left: 4%;
            width: clamp(30px, 5vw, 44px); height: auto;
            opacity: 0.75; z-index: 3;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        /* Dungeon menu objects (chest / monster), placed anywhere on the 2D floor */
        .d-obj {
            position: absolute; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transform: translate(-50%, -100%);
        }
        .d-obj-label {
            color: #fff; font-size: 0.5rem; text-shadow: 2px 2px 0 #000;
            margin-bottom: 8px; text-align: center; line-height: 1.7; white-space: nowrap;
        }
        .d-obj-label small { display: block; color: #ffcc4d; font-size: 0.85em; }
        .d-obj:hover .d-obj-label, .d-obj.near .d-obj-label { color: #ffcc4d; }
        .d-icon { position: relative; animation: bob 1.6s ease-in-out infinite; }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* Treasure chest */
        .chest-icon { width: 54px; height: 46px; }
        .chest-icon .body {
            position: absolute; bottom: 0; width: 100%; height: 28px;
            background: #8b5a2b; border: 3px solid #000;
        }
        .chest-icon .lid {
            position: absolute; top: 0; width: 100%; height: 20px;
            background: #c98a3f; border: 3px solid #000; border-radius: 10px 10px 0 0;
        }
        .chest-icon .lock {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 10px; height: 10px; background: #ffdd55; border: 2px solid #000; z-index: 2;
        }
        .d-obj.chest-big .chest-icon { transform: scale(1.3); transform-origin: bottom center; }

        /* Monster: slime */
        .monster-icon { width: 58px; height: 42px; }
        .monster-icon .body {
            position: absolute; bottom: 0; width: 100%; height: 100%;
            background: #3fbf5f; border: 3px solid #000;
            border-radius: 50% 50% 16% 16% / 65% 65% 20% 20%;
        }
        .monster-icon .eye {
            position: absolute; top: 15px; width: 6px; height: 6px;
            background: #000; border-radius: 50%; z-index: 2;
        }
        .monster-icon .eye.left { left: 16px; }
        .monster-icon .eye.right { right: 16px; }

        /* Monster: boss (developer guardian) */
        .monster-icon.boss { width: 76px; height: 60px; }
        .monster-icon.boss .body { background: #7a2fbf; }
        .monster-icon.boss .eye { background: #ffcc4d; top: 20px; }
        .monster-icon.boss .horn {
            position: absolute; top: -14px; width: 0; height: 0;
            border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-bottom: 16px solid #7a2fbf;
        }
        .monster-icon.boss .horn::after {
            content: ''; position: absolute; top: 2px; left: -8px;
            width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-bottom: 14px solid #000; z-index: -1;
        }
        .monster-icon.boss .horn.left { left: 8px; transform: rotate(-15deg); }
        .monster-icon.boss .horn.right { right: 8px; transform: rotate(15deg); }

        /* Portal: swirling gate to an external world */
        .portal-icon { width: 54px; height: 64px; position: relative; }
        .portal-icon .frame {
            position: absolute; inset: -4px; border: 4px solid #3a2a1a; border-radius: 50%;
            box-shadow: inset 0 0 0 2px #000;
        }
        .portal-icon .swirl {
            position: absolute; inset: 3px; border-radius: 50%; overflow: hidden;
            background: conic-gradient(from 0deg, #7a2fbf, #1e40af, #ffcc4d, #8b5e3c, #7a2fbf);
            animation: portal-spin 5s linear infinite;
        }
        .portal-icon .swirl::after {
            content: ''; position: absolute; inset: 9px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,0,0,0.9), rgba(0,0,0,0.4) 70%, transparent 100%);
        }
        @keyframes portal-spin { to { transform: rotate(360deg); } }

        /* Player sprite that walks across the dungeon floor */
        #dungeon-player {
            position: absolute; width: 66px; height: 82px; z-index: 15;
            transform: translate(-50%, -100%);
        }
        #dungeon-player.face-left { transform: translate(-50%, -100%) scaleX(-1); }
        #dungeon-player-sprite {
            width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;
            filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.5));
        }
        #dungeon-player-sprite.walk { animation: walk-bounce 0.3s infinite; }
        @keyframes walk-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        #interact-prompt {
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace; font-size: 1.1rem; color: #ffcc4d;
            text-shadow: 2px 2px 0 #000; z-index: 16;
            display: none;
            animation: prompt-bob 0.6s ease-in-out infinite alternate;
        }
        #interact-prompt.show { display: block; }
        @keyframes prompt-bob { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-5px); } }

        .hint-bar {
            background: #000; border-top: 4px solid #7a2fbf; box-shadow: inset 0 0 0 2px #fff;
            padding: 12px; text-align: center; color: #ffcc4d;
            font-size: clamp(0.45rem, 1.7vw, 0.6rem);
        }

        .back-hint {
            position: absolute; top: 4%; left: 4%; z-index: 5;
            color: rgba(255,255,255,0.65); font-size: clamp(0.45rem, 1.6vw, 0.55rem);
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 10px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Screen 1: Title / Ready screen -->
    <section id="screen-title" class="screen active">
        <div class="brand-row">
            <img src="assets/hexa-logo.png" class="brand-logo" alt="Hexa Relation">
            <h1 class="game-title">HEXA RELATION</h1>
        </div>
        <p class="game-sub">ゲームの世界を、現実の武器に。</p>

        <div class="status-row">
            <div class="status-item">
                <img src="assets/player-character.png" class="mini-avatar" alt="">
                <span>× 3</span>
            </div>
            <div class="status-item">SCORE<br><span>000000</span></div>
            <div class="status-item">TIME<br><span>300</span></div>
        </div>

        <button id="btn-start" class="start-btn" type="button">START</button>
        <p class="press-hint">PRESS ENTER / TAP START</p>
    </section>

    <!-- Screen 2: Dungeon menu -->
    <section id="screen-dungeon" class="screen">
        <div class="back-hint" id="btn-back">◀ もどる</div>
        <div class="dungeon-bg" id="dungeon-bg">
            <div class="torch" style="left:4%;"></div>
            <div class="torch" style="right:4%;"></div>
            <img src="assets/hexa-logo.png" class="wall-crest" alt="Hexa Relation">

            <div class="d-obj chest" style="left:22%; top:30%;" data-href="intro/card/">
                <span class="d-obj-label">HEXA CARD<small>電子名刺</small></span>
                <div class="d-icon chest-icon">
                    <div class="lid"></div>
                    <div class="body"></div>
                    <div class="lock"></div>
                </div>
            </div>

            <div class="d-obj chest chest-big" style="left:76%; top:28%;" data-href="intro/archive/">
                <span class="d-obj-label">SAVE DATA<small>せいさく じっせき</small></span>
                <div class="d-icon chest-icon">
                    <div class="lid"></div>
                    <div class="body"></div>
                    <div class="lock"></div>
                </div>
            </div>

            <div class="d-obj monster" style="left:26%; top:72%;" data-href="intro/services/">
                <span class="d-obj-label">ご依頼・お見積り<small>REQUEST</small></span>
                <div class="d-icon monster-icon slime">
                    <div class="body"></div>
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>
            </div>

            <div class="d-obj monster" style="left:74%; top:74%;" data-href="save/nox/">
                <span class="d-obj-label">DEVELOPER<small>せいさくしゃ</small></span>
                <div class="d-icon monster-icon boss">
                    <div class="horn left"></div>
                    <div class="horn right"></div>
                    <div class="body"></div>
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>
            </div>

            <div class="d-obj portal" style="left:50%; top:27%;" data-href="https://top3anime.hexarelation.workers.dev/">
                <span class="d-obj-label">TOP3ANIME<small>すきなアニメ3選</small></span>
                <div class="d-icon portal-icon">
                    <div class="frame"></div>
                    <div class="swirl"></div>
                </div>
            </div>

            <div id="dungeon-player">
                <img id="dungeon-player-sprite" src="assets/player-character.png" alt="">
                <div id="interact-prompt">!</div>
            </div>
        </div>
        <p class="hint-bar">気になる ものを クリック / タップ、または 矢印キーで うごこう</p>
    </section>

    <footer style="background:#000; color:#333; text-align:center; padding: 20px; font-family:'Press Start 2P',monospace; font-size:0.5rem;">
        <a href="order/index.html?from=lp" style="color:#555; text-decoration:none;">LP制作のご相談はこちら</a>
        <p style="margin-top:14px;">&copy; 2026 Hexa Relation</p>
    </footer>

    <script>
        const screenTitle = document.getElementById('screen-title');
        const screenDungeon = document.getElementById('screen-dungeon');
        const btnStart = document.getElementById('btn-start');
        const btnBack = document.getElementById('btn-back');

        function goTo(href) {
            if (href.startsWith('#')) {
                const target = document.querySelector(href);
                if (target) target.scrollIntoView({ behavior: 'smooth' });
            } else {
                window.location.href = href;
            }
        }

        function startGame() {
            screenTitle.classList.remove('active');
            screenDungeon.classList.add('active');
        }

        function backToTitle() {
            screenDungeon.classList.remove('active');
            screenTitle.classList.add('active');
        }

        btnStart.addEventListener('click', startGame);
        btnBack.addEventListener('click', backToTitle);

        // ===== Dungeon: top-down room, player walks in 4 directions to the clicked chest/monster =====
        const dungeonBg = document.getElementById('dungeon-bg');
        const dPlayer = document.getElementById('dungeon-player');
        const dSprite = document.getElementById('dungeon-player-sprite');
        const interactPrompt = document.getElementById('interact-prompt');
        const dObjs = Array.from(document.querySelectorAll('.d-obj'));

        let dPlayerX = 50; // percent, left offset
        let dPlayerY = 50; // percent, top offset
        const X_MIN = 4, X_MAX = 96, Y_MIN = 12, Y_MAX = 92;
        let dMoveTarget = null; // { x, y } click-to-move destination, or null
        let dPendingHref = null;
        const D_SPEED = 0.55; // percent per frame
        const D_ARRIVE_OFFSET = 9; // stand this many percent below the object
        const D_RANGE = 13; // proximity radius (percent) for keyboard "nearest object"
        const keys = {};
        let facing = 1;

        function updateDungeonPlayer() {
            dPlayer.style.left = dPlayerX + '%';
            dPlayer.style.top = dPlayerY + '%';
        }

        function walkTo(objLeft, objTop, href) {
            const x = Math.max(X_MIN, Math.min(X_MAX, objLeft));
            const y = Math.max(Y_MIN, Math.min(Y_MAX, objTop + D_ARRIVE_OFFSET));
            dMoveTarget = { x, y };
            dPendingHref = href;
        }

        dObjs.forEach((obj) => {
            obj.addEventListener('click', () => {
                walkTo(parseFloat(obj.style.left), parseFloat(obj.style.top), obj.dataset.href);
            });
        });

        function findNearestObj() {
            let closest = null, closestDist = Infinity;
            for (const obj of dObjs) {
                const dx = parseFloat(obj.style.left) - dPlayerX;
                const dy = parseFloat(obj.style.top) - dPlayerY;
                const dist = Math.hypot(dx, dy);
                if (dist < D_RANGE && dist < closestDist) { closest = obj; closestDist = dist; }
            }
            return closest;
        }

        function dungeonLoop() {
            let moving = false;

            // Free 4-direction movement via keyboard cancels any click-to-move target
            let mvx = 0, mvy = 0;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) mvx -= 1;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) mvx += 1;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) mvy -= 1;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) mvy += 1;

            if (mvx !== 0 || mvy !== 0) {
                dMoveTarget = null;
                const len = Math.hypot(mvx, mvy) || 1;
                dPlayerX = Math.max(X_MIN, Math.min(X_MAX, dPlayerX + (mvx / len) * D_SPEED));
                dPlayerY = Math.max(Y_MIN, Math.min(Y_MAX, dPlayerY + (mvy / len) * D_SPEED));
                if (mvx !== 0) facing = mvx;
                moving = true;
            } else if (dMoveTarget !== null) {
                const dx = dMoveTarget.x - dPlayerX;
                const dy = dMoveTarget.y - dPlayerY;
                const dist = Math.hypot(dx, dy);
                if (dist < 1) {
                    dPlayerX = dMoveTarget.x;
                    dPlayerY = dMoveTarget.y;
                    dMoveTarget = null;
                    if (dPendingHref) {
                        const href = dPendingHref;
                        dPendingHref = null;
                        setTimeout(() => goTo(href), 200);
                    }
                } else {
                    dPlayerX += (dx / dist) * D_SPEED;
                    dPlayerY += (dy / dist) * D_SPEED;
                    if (Math.abs(dx) > 0.3) facing = dx > 0 ? 1 : -1;
                    moving = true;
                }
            }

            dPlayer.classList.toggle('face-left', facing === -1);
            dSprite.classList.toggle('walk', moving);
            interactPrompt.classList.toggle('show', !!findNearestObj());
            updateDungeonPlayer();
        }
        updateDungeonPlayer();
        setInterval(dungeonLoop, 16);

        window.addEventListener('keydown', (e) => {
            if (!screenDungeon.classList.contains('active')) return;
            const gameKeys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
            if (gameKeys.includes(e.key)) e.preventDefault();
            keys[e.key] = true;
            if (e.key === 'Enter' || e.key === 'z' || e.key === 'Z') {
                const near = findNearestObj();
                if (near) { dMoveTarget = null; goTo(near.dataset.href); }
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });
        window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

        // Secret admin sequence via keyboard: A -> C -> E
        let aceStep = 0;
        const aceSeq = ['a', 'c', 'e'];

        window.addEventListener('keydown', (e) => {
            if (screenTitle.classList.contains('active')) {
                if (e.key === 'Enter' || e.key === ' ' || e.key === 'z' || e.key === 'Z') {
                    e.preventDefault();
                    startGame();
                }
            } else if (screenDungeon.classList.contains('active')) {
                if (e.key === 'Escape') {
                    backToTitle();
                }
            }

            const k = e.key.toLowerCase();
            if (k === aceSeq[aceStep]) {
                aceStep++;
                if (aceStep === aceSeq.length) {
                    window.location.href = 'admin/';
                    aceStep = 0;
                }
            } else {
                aceStep = 0;
            }
        });
    </script>
</body>
</html>
