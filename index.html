    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            background: #5c94fc;
        }

        #game {
            position: relative;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        /* Sky */
        .sky {
            position: absolute; inset: 0;
            background: linear-gradient(#5c94fc 0%, #78b8fc 70%, #a8d8fc 100%);
        }
        .cloud {
            position: absolute; background: #fff; border-radius: 40%;
            opacity: 0.9;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: #fff; border-radius: 50%;
        }

        /* Ground */
        .ground {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 18%;
            background: repeating-linear-gradient(90deg, #c84c0c 0, #c84c0c 40px, #a83c08 40px, #a83c08 42px);
            border-top: 6px solid #6b3400;
            box-shadow: inset 0 8px 0 rgba(255,255,255,0.15);
        }

        /* Title */
        .hud {
            position: absolute; top: 3%; left: 0; right: 0; text-align: center; z-index: 20;
            color: #fff; text-shadow: 3px 3px 0 #000;
        }
        .hud h1 { font-size: clamp(1rem, 3vw, 1.8rem); margin: 0 0 6px; letter-spacing: 0.1em; }
        .hud p { font-size: clamp(0.5rem, 1.3vw, 0.7rem); margin: 0; opacity: 0.9; }

        /* World objects (positioned along ground, in % of #game width) */
        .obj {
            position: absolute; bottom: 18%; cursor: default;
            display: flex; flex-direction: column; align-items: center;
        }
        .obj-label {
            font-size: 0.5rem; color: #fff; text-shadow: 2px 2px 0 #000;
            margin-bottom: 8px; white-space: nowrap; text-align: center; line-height: 1.6;
        }

        /* Pipe */
        .pipe {
            width: 90px; height: 100px; background: #00a800;
            border: 4px solid #000;
            box-shadow: inset -6px 0 0 rgba(0,0,0,0.25);
            position: relative;
        }
        .pipe::before {
            content: ''; position: absolute; top: -16px; left: -8px; right: -8px; height: 26px;
            background: #00d800; border: 4px solid #000;
        }

        /* Door */
        .door {
            width: 60px; height: 90px; background: #8b4513;
            border: 4px solid #000; border-radius: 30px 30px 4px 4px;
            position: relative;
        }
        .door::after {
            content: ''; position: absolute; right: 8px; top: 50%; width: 8px; height: 8px;
            background: #fdb700; border-radius: 50%;
        }

        /* Flagpole */
        .flagpole { width: 8px; height: 220px; background: #ccc; border: 2px solid #000; }
        .flagpole::before {
            content: ''; position: absolute; top: 0; left: 8px; width: 0; height: 0;
            border-top: 20px solid transparent; border-bottom: 20px solid transparent;
            border-left: 30px solid #ff2222;
        }
        .flagpole::after {
            content: ''; position: absolute; top: -14px; left: -6px; width: 20px; height: 20px;
            background: #fdb700; border-radius: 50%; border: 3px solid #000;
        }

        /* Player */
        #player {
            position: absolute; bottom: 18%; width: 52px; height: 64px;
            z-index: 15;
        }
        #player.face-left { transform: scaleX(-1); }
        #player-canvas {
            width: 100%; height: 100%; display: block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.35));
        }
        #player-canvas.walk { animation: walk-bounce 0.3s infinite; }
        @keyframes walk-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        /* Prompt */
        #prompt {
            position: absolute; left: 50%; transform: translateX(-50%);
            bottom: 24%; background: #000; color: #fff; padding: 8px 14px;
            border: 2px solid #fff; font-size: 0.55rem; white-space: nowrap;
            display: none; z-index: 25;
        }
        #prompt.show { display: block; }

        /* Touch controls */
        #touch-controls {
            position: absolute; bottom: 3%; left: 0; right: 0; z-index: 30;
            display: flex; justify-content: space-between; padding: 0 20px;
            pointer-events: none;
        }
        .touch-btn {
            pointer-events: auto; width: 56px; height: 56px; border-radius: 50%;
            background: rgba(255,255,255,0.25); border: 3px solid #fff; color: #fff;
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }
        .touch-btn:active { background: rgba(255,255,255,0.5); }
        #touch-dir { display: flex; gap: 12px; }
        #touch-action { background: rgba(255,60,60,0.35); border-color: #ff6666; }

        @media (min-width: 900px) {
            #touch-controls { display: none; }
        }
    </style>
</head>
<body>
    <div id="game">
        <div class="sky"></div>
        <div class="cloud" style="top:8%; left:6%; width:70px; height:26px;"></div>
        <div class="cloud" style="top:14%; left:38%; width:90px; height:30px;"></div>
        <div class="cloud" style="top:6%; left:70%; width:60px; height:22px;"></div>

        <div class="hud">
            <h1>HEXA RELATION</h1>
            <p>← → / A D で うごく　・　決定キー（Enter / Space / Z）で えらぶ</p>
        </div>

        <div class="ground"></div>

        <!-- World objects: positions are left(%) along the ground -->
        <div class="obj" style="left: 24%;" data-target="link" data-href="intro/card/" id="obj-pipe">
            <span class="obj-label">HEXA CARD<br>電子名刺</span>
            <div class="pipe"></div>
        </div>

        <div class="obj" style="left: 54%;" data-target="link" data-href="#save-data" id="obj-door">
            <span class="obj-label">SAVE DATA<br>せいさく じっせき</span>
            <div class="door"></div>
        </div>

        <div class="obj" style="left: 86%;" data-target="link" data-href="save/nox/" id="obj-flag">
            <span class="obj-label">DEVELOPER<br>せいさくしゃ</span>
            <div class="flagpole"></div>
        </div>

        <div id="player">
            <canvas id="player-canvas" width="32" height="40" class="walk"></canvas>
        </div>

        <div id="prompt"></div>

        <div id="touch-controls">
            <div id="touch-dir">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
            </div>
            <div class="touch-btn" id="touch-action">●</div>

    </div>

    <!-- Save Data reveal (anchor target for the door) -->
    <section id="save-data" style="background:#000; color:#fff; padding: 60px 20px; font-family:'Press Start 2P',monospace;">
        <h2 style="text-align:center; color:#fdb700; font-size:1rem; margin-bottom: 40px;">▼ SAVE DATA ▼</h2>
        <div style="max-width:900px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px;">
            <a href="save/7ch/" style="border:2px dashed #555; padding:20px; text-align:center; color:#fff; text-decoration:none; font-size:0.6rem;">
                <div style="opacity:.5; margin-bottom:10px;">クロノトリガー風</div><div>7CH</div>
            </a>
            <a href="save/choco/" style="border:2px dashed #555; padding:20px; text-align:center; color:#fff; text-decoration:none; font-size:0.6rem;">
                <div style="opacity:.5; margin-bottom:10px;">ロマサガ風</div><div>CHOCO</div>
            </a>
            <a href="save/sabanomiso/" style="border:2px dashed #555; padding:20px; text-align:center; color:#fff; text-decoration:none; font-size:0.6rem;">
                <div style="opacity:.5; margin-bottom:10px;">DBD風</div><div>SABANOMISO</div>
            </a>
            <a href="save/ten/" style="border:2px dashed #555; padding:20px; text-align:center; color:#fff; text-decoration:none; font-size:0.6rem;">
                <div style="opacity:.5; margin-bottom:10px;">FF風</div><div>TEN</div>
            </a>
        </div>
        <p style="text-align:center; margin-top:30px;">
            <a href="intro/archive/" style="color:#888; font-size:0.55rem;">▶ もっと見る（アーカイブ）</a>
        </p>
        <p style="text-align:center; margin-top:20px;">
            <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;" style="color:#888; font-size:0.55rem;">▲ TOPへ戻る</a>
        </p>
    </section>

    <footer style="background:#000; color:#333; text-align:center; padding: 20px; font-family:'Press Start 2P',monospace; font-size:0.5rem;">
        <a href="order/index.html?from=lp" style="color:#555; text-decoration:none;">LP制作のご相談はこちら</a>
        <p style="margin-top:14px;">&copy; 2026 Hexa Relation</p>
    </footer>

    <script>
        const game = document.getElementById('game');
        const player = document.getElementById('player');
        const playerCanvas = document.getElementById('player-canvas');
        const prompt = document.getElementById('prompt');

        // Draw the character sprite pixelated (downscale onto a small canvas)
        (function drawPixelSprite() {
            const ctx = playerCanvas.getContext('2d');
            const img = new Image();
            img.onload = () => {
                ctx.imageSmoothingEnabled = true;
                ctx.clearRect(0, 0, playerCanvas.width, playerCanvas.height);
                // Fit the image into the canvas while preserving aspect ratio
                const scale = Math.min(playerCanvas.width / img.width, playerCanvas.height / img.height);
                const w = img.width * scale;
                const h = img.height * scale;
                ctx.drawImage(img, (playerCanvas.width - w) / 2, playerCanvas.height - h, w, h);
            };
            img.src = 'assets/player-character.png';
        })();

        const objects = Array.from(document.querySelectorAll('.obj'));
        let playerX = 4; // percent
        const SPEED = 0.6;
        const RANGE = 6; // percent distance to trigger "near object"
        let facing = 1;
        let nearestObj = null;
        const keys = {};

        function gameWidthPercentPerPixel() {
            return 100 / game.getBoundingClientRect().width;
        }

        function updatePlayerPosition() {
            playerX = Math.max(2, Math.min(94, playerX));
            player.style.left = playerX + '%';
        }

        function findNearestObject() {
            let closest = null;
            let closestDist = Infinity;
            for (const obj of objects) {
                const objLeft = parseFloat(obj.style.left);
                const dist = Math.abs(objLeft - playerX);
                if (dist < RANGE && dist < closestDist) {
                    closest = obj;
                    closestDist = dist;
                }
            }
            return closest;
        }

        function updatePrompt() {
            nearestObj = findNearestObject();
            if (nearestObj) {
                prompt.textContent = '▶ 決定キーで えらぶ';
                prompt.classList.add('show');
            } else {
                prompt.classList.remove('show');
            }
        }

        function triggerObject(obj) {
            if (!obj) return;
            if (obj.dataset.target === 'link') {
                const href = obj.dataset.href;
                if (href.startsWith('#')) {
                    document.querySelector(href).scrollIntoView({ behavior: 'smooth' });
                } else {
                    window.location.href = href;
                }
            }
        }

        function loop() {
            let moving = false;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                playerX -= SPEED;
                facing = -1;
                moving = true;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                playerX += SPEED;
                facing = 1;
                moving = true;
            }
            updatePlayerPosition();
            player.classList.toggle('face-left', facing === -1);
            playerCanvas.classList.toggle('walk', moving);
            updatePrompt();
        }

        // Secret admin sequence via keyboard: A -> C -> E (only counted when NOT used for movement in the same frame burst)
        let aceStep = 0;
        const aceSeq = ['a', 'c', 'e'];

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key === 'Enter' || e.key === ' ' || e.key === 'z' || e.key === 'Z') {
                triggerObject(nearestObj);
            }

            const k = e.key.toLowerCase();
            if (k === aceSeq[aceStep]) {
                aceStep++;
                if (aceStep === aceSeq.length) {
                    window.location.href = 'admin/';
                    aceStep = 0;
                }
            } else {
                aceStep = 0;
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });
        // Prevent movement from getting "stuck" if the tab/window loses focus mid-keypress
        window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { for (const k in keys) keys[k] = false; }
        });

        // Touch controls
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnAction = document.getElementById('touch-action');

        function bindHold(el, key) {
            const start = (e) => { e.preventDefault(); keys[key] = true; };
            const end = (e) => { e.preventDefault(); keys[key] = false; };
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('mouseleave', end);
        }
        bindHold(btnLeft, 'ArrowLeft');
        bindHold(btnRight, 'ArrowRight');
        btnAction.addEventListener('click', () => {
            triggerObject(nearestObj);
        });

        updatePlayerPosition();
        setInterval(loop, 16);
    </script>
</body>
</html>
