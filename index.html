    <script>

        // Interaction Sound
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        document.addEventListener('mousedown', (e) => {
            if (e.target.closest('a')) playClickSound();
        });

        // Secret Admin Access (Sequential Click: A -> C -> E)
        const philText = document.getElementById('philosophy-text');
        const originalContent = philText.innerHTML;
        let aceStep = 0;

        function checkAce(char) {
            const sequence = ['A', 'C', 'E'];
            if (char === sequence[aceStep]) {
                aceStep++;
                if (aceStep === sequence.length) {
                    window.location.href = 'admin/';
                    aceStep = 0;
                }
            } else if (char !== ' ' && char !== '\n') {
                aceStep = 0;
            }
        }

        // Wrap each character to enable clicking (ignoring HTML tags)
        philText.innerHTML = originalContent.split('').map(char => {
            if (char === '<' || char === '>' || char === 'b' || char === 'r' || char === '/') return char;
            return `<span onclick="checkAce('${char.toUpperCase()}')" style="cursor:default;">${char}</span>`;
        }).join('');
    </script>
